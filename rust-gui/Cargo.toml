[package]
name = "stream-archive-gui"
version = "0.5.2"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/p1k1g/stream-archive"
build = "build.rs"

[dependencies]
slint = { version = "=1.18.0", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
stream-archive-server = { path = "../rust-web" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[build-dependencies]
slint-build = "=1.18.0"
