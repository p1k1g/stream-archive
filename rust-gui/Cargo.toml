[package]
name = "stream-archive-gui"
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/p1k1g/stream-archive"
build = "build.rs"

[dependencies]
slint = { version = "=1.18.0", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2"] }
stream-archive-server = { path = "../rust-runtime" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
slint-build = "=1.18.0"
winresource = "=0.1.31"
