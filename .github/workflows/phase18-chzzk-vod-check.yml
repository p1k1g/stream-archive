name: Phase 18 CHZZK VOD check

on:
  pull_request:
    branches: [main]
    paths:
      - "rust-web/src/main.rs"
      - "rust-web/src/platform/**"
      - "rust-web/src/vod.rs"
      - "rust-web/src/vod_queue.rs"
      - "rust-web/web/**"
      - "maintenance/Test-Phase18ChzzkVod.ps1"
      - ".github/workflows/phase18-chzzk-vod-check.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase18-chzzk-vod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase18-refactor:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase18-chzzk-vod
          fetch-depth: 0

      - name: Apply CHZZK API plus Streamlink source refactor
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import re

          path = Path('rust-web/src/platform/chzzk/vod.rs')
          text = path.read_text(encoding='utf-8')
          if 'struct ChzzkTools {' in text:
              print('CHZZK Streamlink refactor already present')
              raise SystemExit(0)

          def one(old, new, name):
              global text
              if old not in text:
                  raise RuntimeError(f'missing anchor: {name}')
              text = text.replace(old, new, 1)

          one('    backend::LogBuffer,', '    backend::{LogBuffer, read_safe_settings, settings_path},', 'backend import')
          one('    collections::{BTreeSet, VecDeque},', '    collections::VecDeque,', 'collections')
          one('const PROGRESS_PREFIX: &str = "__CHZZK_PROGRESS__";\n', '', 'progress prefix')
          one(
          '''#[derive(Debug, Clone)]
          struct Tools {
              yt_dlp: PathBuf,
              ffmpeg: Option<PathBuf>,
          }

          #[derive(Debug, Clone)]
          struct Metadata {''',
          '''#[derive(Debug, Clone)]
          struct ChzzkTools {
              streamlink: PathBuf,
              ffmpeg: PathBuf,
          }

          #[derive(Debug, Clone)]
          struct Metadata {''',
          'tools struct')
          text = re.sub(r'\n#\[derive\(Clone\)\]\nstruct PublicPlaybackFallback \{[\s\S]*?\n\}\n', '\n', text, count=1)

          one(
          '''    let tools = resolve_tools(backend, &req.yt_dlp_path, &req.ffmpeg_path)?;
              let job_guard = job_dir(backend)?;
              let job_dir = job_guard.path().to_path_buf();
              let _job_guard = job_guard;
              let cookie_file = chzzk_cookie_file(&job_dir)?;
              let metadata =
                  load_metadata(&tools, &req.vod_url, cookie_file.as_deref(), cancel, logs).await?;''',
          '''    let tools = resolve_chzzk_tools(backend, &req.ffmpeg_path)?;
              let job_guard = job_dir(backend)?;
              let job_dir = job_guard.path().to_path_buf();
              let _job_guard = job_guard;
              let cookie_file = chzzk_cookie_file(&job_dir)?;
              let metadata = load_chzzk_metadata(
                  &tools,
                  &req.vod_url,
                  cookie_file.as_deref(),
                  cancel,
                  logs,
              )
              .await?;''',
          'analysis path')
          one('    let tools = resolve_tools(backend, &req.yt_dlp_path, &req.ffmpeg_path)?;',
              '    let tools = resolve_chzzk_tools(backend, &req.ffmpeg_path)?;', 'download tools')
          one(
          '''    let metadata =
                  load_metadata(&tools, &req.vod_url, cookie_file.as_deref(), cancel, logs).await?;''',
          '''    let metadata = load_chzzk_metadata(
                  &tools,
                  &req.vod_url,
                  cookie_file.as_deref(),
                  cancel,
                  logs,
              )
              .await?;''',
          'download metadata')
          one('Regex::new(r"^best(?:\\[height<=\\d+\\])?$")',
              'Regex::new(r"^(?:best|worst|\\d+p(?:\\d+)?|best\\[height<=\\d+\\])$")', 'quality validation')

          metadata_block = r'''async fn load_chzzk_metadata(
              tools: &ChzzkTools,
              vod_url: &str,
              cookie_file: Option<&Path>,
              cancel: &AtomicBool,
              logs: &LogBuffer,
          ) -> Result<Metadata> {
              if cancel.load(Ordering::SeqCst) {
                  bail!("CHZZK VOD metadata request cancelled");
              }
              let auth = ChzzkAuth::load()?;
              if auth.partial() {
                  bail!("CHZZK 인증정보가 일부만 설정되어 있습니다. NID_AUT/NID_SES를 모두 저장하세요.");
              }
              let video_no = video_id(vod_url)?;
              let client = Client::new();
              let mut request = client.get(format!(
                  "https://api.chzzk.naver.com/service/v3/videos/{video_no}"
              ));
              if let Some(cookie) = auth.cookie_header() {
                  request = request.header(reqwest::header::COOKIE, cookie);
              }
              let value: Value = request
                  .send()
                  .await
                  .context("CHZZK video detail request failed")?
                  .error_for_status()
                  .context("CHZZK video detail HTTP error")?
                  .json()
                  .await
                  .context("CHZZK video detail JSON parse failed")?;
              if value.get("code").and_then(Value::as_i64) != Some(200) {
                  bail!("CHZZK video detail API returned a non-success response");
              }
              let content = value
                  .get("content")
                  .filter(|value| !value.is_null())
                  .with_context(|| match auth.state() {
                      ChzzkAuthState::Missing => "CHZZK VOD 정보를 가져오지 못했습니다. 로그인/연령 확인이 필요한 VOD라면 NID_AUT/NID_SES를 저장하세요.",
                      ChzzkAuthState::Partial => "CHZZK 인증정보가 일부만 설정되어 있습니다. NID_AUT/NID_SES를 모두 저장하세요.",
                      ChzzkAuthState::Configured => "CHZZK 인증 쿠키가 만료되었거나 이 VOD를 볼 권한이 없을 수 있습니다.",
                  })?;
              let mut metadata = metadata_from_chzzk_content(content)?;
              metadata.qualities = streamlink_quality_options(tools, vod_url, cookie_file, cancel, logs)
                  .await
                  .with_context(|| match auth.state() {
                      ChzzkAuthState::Missing => "Streamlink가 CHZZK VOD 스트림을 찾지 못했습니다. 인증이 필요한 VOD인지 확인하세요.",
                      ChzzkAuthState::Partial => "CHZZK 인증정보가 일부만 설정되어 있습니다.",
                      ChzzkAuthState::Configured => "Streamlink가 CHZZK VOD 스트림을 열지 못했습니다. 쿠키 만료 또는 시청 권한을 확인하세요.",
                  })?;
              logs.push(format!(
                  "[VOD:CHZZK] metadata via CHZZK API; streamlink qualities={}",
                  metadata.qualities.len()
              )).await;
              Ok(metadata)
          }

          async fn streamlink_quality_options(
              tools: &ChzzkTools,
              vod_url: &str,
              cookie_file: Option<&Path>,
              cancel: &AtomicBool,
              logs: &LogBuffer,
          ) -> Result<Vec<VodQualityOption>> {
              let mut args = vec![
                  "--no-config".to_string(),
                  "--json".to_string(),
                  "--ffmpeg-ffmpeg".to_string(),
                  tools.ffmpeg.display().to_string(),
              ];
              append_streamlink_cookie_arg(&mut args, cookie_file);
              args.push(vod_url.to_string());
              let stdout = run_capture(
                  &tools.streamlink,
                  &args,
                  cancel,
                  logs,
                  "CHZZK Streamlink analyze",
              ).await?;
              let value: Value = serde_json::from_str(stdout.trim())
                  .context("Streamlink CHZZK JSON parse failed")?;
              quality_options_from_streamlink_json(&value)
          }

          fn quality_options_from_streamlink_json(value: &Value) -> Result<Vec<VodQualityOption>> {
              let streams = value
                  .get("streams")
                  .and_then(Value::as_object)
                  .context("Streamlink CHZZK JSON has no streams")?;
              let quality_re = Regex::new(r"^(\d+)p(\d+)?$").unwrap();
              let mut names = streams.keys().filter_map(|name| {
                  let captures = quality_re.captures(name)?;
                  let height = captures.get(1)?.as_str().parse::<u64>().ok()?;
                  let fps = captures
                      .get(2)
                      .and_then(|value| value.as_str().parse::<u64>().ok())
                      .unwrap_or(0);
                  Some((height, fps, name.clone()))
              }).collect::<Vec<_>>();
              names.sort_by(|left, right| right.cmp(left));
              let mut options = vec![VodQualityOption {
                  value: "best".into(),
                  label: "최고 화질 (자동)".into(),
              }];
              for (_, _, name) in names {
                  options.push(VodQualityOption {
                      value: name.clone(),
                      label: name,
                  });
              }
              Ok(options)
          }

          fn metadata_from_chzzk_content(content: &Value) -> Result<Metadata> {
              let title = content
                  .get("videoTitle")
                  .and_then(Value::as_str)
                  .unwrap_or("")
                  .trim()
                  .to_string();
              if title.is_empty() {
                  bail!("CHZZK API did not return a VOD title");
              }
              let streamer = content
                  .pointer("/channel/channelName")
                  .and_then(Value::as_str)
                  .unwrap_or("CHZZK")
                  .trim()
                  .to_string();
              let streamer_id = content
                  .pointer("/channel/channelId")
                  .and_then(Value::as_str)
                  .unwrap_or("")
                  .trim()
                  .to_string();
              let duration_seconds = content
                  .get("duration")
                  .and_then(|value| value.as_u64().or_else(|| value.as_f64().map(|n| n.max(0.0) as u64)))
                  .unwrap_or(0);
              let date = content
                  .get("publishDate")
                  .and_then(Value::as_str)
                  .and_then(short_date)
                  .or_else(|| {
                      content.get("publishDateAt")
                          .and_then(|value| value.as_i64().or_else(|| value.as_f64().map(|n| n as i64)))
                          .and_then(chrono::DateTime::<Utc>::from_timestamp_millis)
                          .map(|timestamp| {
                              let local = timestamp.with_timezone(&Local);
                              format!("{:02}{:02}{:02}", local.year() % 100, local.month(), local.day())
                          })
                  })
                  .unwrap_or_else(today_short_date);
              Ok(Metadata {
                  title,
                  streamer,
                  streamer_id,
                  date,
                  duration_seconds,
                  qualities: vec![VodQualityOption {
                      value: "best".into(),
                      label: "최고 화질 (자동)".into(),
                  }],
              })
          }
          '''
          pattern = re.compile(r'async fn load_metadata\([\s\S]*?\nfn analysis_view\(')
          text, n = pattern.subn(lambda _match: metadata_block + '\nfn analysis_view(', text, count=1)
          if n != 1:
              raise RuntimeError('metadata block replacement failed')

          download_block = r'''async fn download_video(
              tools: &ChzzkTools,
              req: &VodDownloadRequest,
              cookie_file: Option<&Path>,
              output: &Path,
              status: &Arc<RwLock<VodJobStatus>>,
              cancel: &AtomicBool,
              _logs: &LogBuffer,
          ) -> Result<()> {
              let transport_output = output.with_extension("stream.ts");
              let _ = fs::remove_file(&transport_output);
              let (mut quality_args, stream_name) = streamlink_quality_args(req.quality.trim());
              let mut args = vec![
                  "--no-config".to_string(),
                  "--loglevel".to_string(),
                  "info".to_string(),
                  "--progress=force".to_string(),
                  "--ffmpeg-ffmpeg".to_string(),
                  tools.ffmpeg.display().to_string(),
                  "--output".to_string(),
                  transport_output.display().to_string(),
              ];
              append_streamlink_cookie_arg(&mut args, cookie_file);
              args.append(&mut quality_args);
              args.push(req.vod_url.clone());
              args.push(stream_name);

              run_streamlink_process(&tools.streamlink, &args, cancel).await?;
              if cancel.load(Ordering::SeqCst) {
                  let _ = fs::remove_file(&transport_output);
                  return Ok(());
              }
              let size = fs::metadata(&transport_output)
                  .with_context(|| format!("Streamlink CHZZK output missing: {}", transport_output.display()))?
                  .len();
              if size == 0 {
                  bail!("Streamlink CHZZK output is empty");
              }
              {
                  let mut current = status.write().await;
                  current.percent = 97.0;
                  current.message = "CHZZK VOD MP4 마무리 중…".into();
              }
              let result = run_ffmpeg_remux(&tools.ffmpeg, &transport_output, output, cancel).await;
              let _ = fs::remove_file(&transport_output);
              result
          }

          fn streamlink_quality_args(quality: &str) -> (Vec<String>, String) {
              if let Some(captures) = Regex::new(r"^best\[height<=(\d+)\]$")
                  .unwrap()
                  .captures(quality)
              {
                  let height = captures.get(1).unwrap().as_str();
                  return (
                      vec!["--stream-sorting-excludes".into(), format!(">{height}p")],
                      "best".into(),
                  );
              }
              let stream = if quality.is_empty() { "best" } else { quality };
              (Vec::new(), stream.to_string())
          }

          async fn run_streamlink_process(
              streamlink: &Path,
              args: &[String],
              cancel: &AtomicBool,
          ) -> Result<()> {
              let mut command = Command::new(streamlink);
              configure_python_cli_command(&mut command);
              command
                  .args(args)
                  .stdin(Stdio::null())
                  .stdout(Stdio::piped())
                  .stderr(Stdio::piped())
                  .kill_on_drop(true);
              let mut child = command
                  .spawn()
                  .with_context(|| format!("Streamlink 실행 실패: {}", streamlink.display()))?;
              let (tx, mut rx) = mpsc::unbounded_channel::<String>();
              if let Some(stdout) = child.stdout.take() {
                  let tx = tx.clone();
                  tokio::spawn(async move {
                      let mut lines = BufReader::new(stdout).lines();
                      while let Ok(Some(line)) = lines.next_line().await {
                          let _ = tx.send(line);
                      }
                  });
              }
              if let Some(stderr) = child.stderr.take() {
                  let tx = tx.clone();
                  tokio::spawn(async move {
                      let mut lines = BufReader::new(stderr).lines();
                      while let Ok(Some(line)) = lines.next_line().await {
                          let _ = tx.send(line);
                      }
                  });
              }
              drop(tx);
              let mut tail = VecDeque::with_capacity(20);
              let exit_status = loop {
                  if cancel.load(Ordering::SeqCst) {
                      terminate_owned(&mut child).await;
                      return Ok(());
                  }
                  while let Ok(line) = rx.try_recv() {
                      push_tail(&mut tail, &line);
                  }
                  if let Some(exit) = child.try_wait().context("Streamlink CHZZK 상태 확인 실패")? {
                      break exit;
                  }
                  tokio::time::sleep(Duration::from_millis(150)).await;
              };
              while let Ok(line) = rx.try_recv() {
                  push_tail(&mut tail, &line);
              }
              if !exit_status.success() {
                  bail!(
                      "Streamlink CHZZK 다운로드 실패 (exit={}): {}",
                      exit_code(exit_status),
                      redact(&tail.into_iter().collect::<Vec<_>>().join(" | "))
                  );
              }
              Ok(())
          }

          async fn run_ffmpeg_remux(
              ffmpeg: &Path,
              input: &Path,
              output: &Path,
              cancel: &AtomicBool,
          ) -> Result<()> {
              let mut command = Command::new(ffmpeg);
              command
                  .arg("-hide_banner")
                  .arg("-nostdin")
                  .arg("-y")
                  .arg("-i")
                  .arg(input)
                  .arg("-map")
                  .arg("0:v:0?")
                  .arg("-map")
                  .arg("0:a:0?")
                  .arg("-c")
                  .arg("copy")
                  .arg("-movflags")
                  .arg("+faststart")
                  .arg(output)
                  .stdin(Stdio::null())
                  .stdout(Stdio::null())
                  .stderr(Stdio::piped())
                  .kill_on_drop(true);
              let mut child = command
                  .spawn()
                  .with_context(|| format!("ffmpeg CHZZK remux 실행 실패: {}", ffmpeg.display()))?;
              let stderr = child
                  .stderr
                  .take()
                  .ok_or_else(|| anyhow!("ffmpeg stderr unavailable"))?;
              let (tx, mut rx) = mpsc::unbounded_channel::<String>();
              tokio::spawn(async move {
                  let mut lines = BufReader::new(stderr).lines();
                  while let Ok(Some(line)) = lines.next_line().await {
                      let _ = tx.send(line);
                  }
              });
              let mut tail = VecDeque::with_capacity(20);
              let exit_status = loop {
                  if cancel.load(Ordering::SeqCst) {
                      terminate_owned(&mut child).await;
                      let _ = fs::remove_file(output);
                      return Ok(());
                  }
                  while let Ok(line) = rx.try_recv() {
                      push_tail(&mut tail, &line);
                  }
                  if let Some(exit) = child.try_wait().context("ffmpeg CHZZK remux 상태 확인 실패")? {
                      break exit;
                  }
                  tokio::time::sleep(Duration::from_millis(100)).await;
              };
              while let Ok(line) = rx.try_recv() {
                  push_tail(&mut tail, &line);
              }
              if !exit_status.success() {
                  let _ = fs::remove_file(output);
                  bail!(
                      "ffmpeg CHZZK local TS remux 실패 (exit={}): {}",
                      exit_code(exit_status),
                      redact(&tail.into_iter().collect::<Vec<_>>().join(" | "))
                  );
              }
              Ok(())
          }

          fn configure_python_cli_command(command: &mut Command) {
              command.env("PYTHONUTF8", "1");
              command.env("PYTHONIOENCODING", "utf-8");
          }
          '''
          pattern = re.compile(r'async fn download_video\([\s\S]*?\nasync fn run_capture\(')
          text, n = pattern.subn(lambda _match: download_block + '\nasync fn run_capture(', text, count=1)
          if n != 1:
              raise RuntimeError('download block replacement failed')
          text = text.replace('configure_ytdlp_command(&mut command);', 'configure_python_cli_command(&mut command);')

          resolver_block = r'''fn append_streamlink_cookie_arg(args: &mut Vec<String>, cookie_file: Option<&Path>) {
              if let Some(path) = cookie_file {
                  args.push("--http-cookies-file".to_string());
                  args.push(path.display().to_string());
              }
          }

          fn resolve_chzzk_tools(backend: &Path, ffmpeg: &str) -> Result<ChzzkTools> {
              let settings = read_safe_settings(&settings_path(backend)).unwrap_or_default();
              let streamlink = resolve_streamlink_tool(backend, &settings)?;
              let ffmpeg = resolve_tool(
                  ffmpeg,
                  &[
                      backend.join("vod").join("ffmpeg.exe"),
                      backend.join("ffmpeg.exe"),
                  ],
                  &["ffmpeg.exe", "ffmpeg"],
              )
              .ok_or_else(|| anyhow!(
                  "ffmpeg 실행 파일을 찾지 못했습니다. 설정 > 외부 프로그램에서 FFMPEG_PATH를 확인하세요."
              ))?;
              Ok(ChzzkTools { streamlink, ffmpeg })
          }

          fn resolve_streamlink_tool(
              backend: &Path,
              settings: &std::collections::BTreeMap<String, String>,
          ) -> Result<PathBuf> {
              for key in ["STREAMLINK_PATH", "STREAMLINK_FALLBACK"] {
                  if let Some(value) = settings.get(key) {
                      let value = value.trim();
                      if !value.is_empty() && !value.eq_ignore_ascii_case("AUTO") {
                          let path = PathBuf::from(value);
                          if path.is_file() {
                              return Ok(path);
                          }
                      }
                  }
              }
              let mut candidates = vec![backend.join("streamlink.exe")];
              #[cfg(windows)]
              {
                  candidates.push(PathBuf::from(r"C:\Program Files\Streamlink\bin\streamlink.exe"));
                  candidates.push(PathBuf::from(r"C:\Program Files\Streamlink\streamlink.exe"));
              }
              resolve_tool("", &candidates, &["streamlink.exe", "streamlink"])
                  .ok_or_else(|| anyhow!(
                      "Streamlink 실행 파일을 찾지 못했습니다. STREAMLINK_PATH/STREAMLINK_FALLBACK 설정을 확인하세요."
                  ))
          }
          '''
          pattern = re.compile(r'fn append_cookie_arg\([\s\S]*?\nfn resolve_tool\(')
          text, n = pattern.subn(lambda _match: resolver_block + '\nfn resolve_tool(', text, count=1)
          if n != 1:
              raise RuntimeError('resolver replacement failed')
          text = text.replace(
              '"yt-dlp 완료 파일을 찾지 못했습니다: {}"',
              '"CHZZK 완료 파일을 찾지 못했습니다: {}"',
          )

          quality_tests = r'''    #[test]
              fn streamlink_json_builds_quality_options() {
                  let value = serde_json::json!({
                      "streams": {
                          "144p": {},
                          "720p": {},
                          "1080p": {},
                          "worst": {},
                          "best": {}
                      }
                  });
                  let options = quality_options_from_streamlink_json(&value).unwrap();
                  assert_eq!(
                      options.iter().map(|value| value.value.as_str()).collect::<Vec<_>>(),
                      vec!["best", "1080p", "720p", "144p"]
                  );
              }

              #[test]
              fn maps_legacy_height_quality_to_streamlink_selector() {
                  let (args, stream) = streamlink_quality_args("best[height<=1080]");
                  assert_eq!(stream, "best");
                  assert_eq!(args, vec!["--stream-sorting-excludes", ">1080p"]);
                  let (args, stream) = streamlink_quality_args("720p");
                  assert!(args.is_empty());
                  assert_eq!(stream, "720p");
              }
          '''
          pattern = re.compile(
              r'    #\[test\]\n    fn builds_quality_options_from_video_heights\(\)[\s\S]*?\n    #\[test\]\n    fn validates_single_part_download_contract'
          )
          text, n = pattern.subn(
              lambda _match: quality_tests + '\n    #[test]\n    fn validates_single_part_download_contract',
              text,
              count=1,
          )
          if n != 1:
              raise RuntimeError('quality tests replacement failed')

          api_test = r'''    #[test]
              fn chzzk_api_metadata_maps_to_common_analysis_shape() {
                  let content = serde_json::json!({
                      "videoTitle": "테스트 VOD",
                      "duration": 1234,
                      "publishDate": "2026-09-13 10:00:00",
                      "channel": {
                          "channelName": "테스트 채널",
                          "channelId": "0123456789abcdef0123456789abcdef"
                      }
                  });
                  let metadata = metadata_from_chzzk_content(&content).unwrap();
                  assert_eq!(metadata.title, "테스트 VOD");
                  assert_eq!(metadata.streamer, "테스트 채널");
                  assert_eq!(metadata.date, "260913");
                  assert_eq!(metadata.duration_seconds, 1234);
                  assert_eq!(
                      analysis_view("https://chzzk.naver.com/video/1", &metadata).part_count,
                      1
                  );
              }
          '''
          pattern = re.compile(
              r'    #\[test\]\n    fn public_api_fallback_builds_dash_url_for_abr_hls\(\)[\s\S]*?\n    #\[test\]\n    fn redacts_naver_cookie_values'
          )
          text, n = pattern.subn(
              lambda _match: api_test + '\n    #[test]\n    fn redacts_naver_cookie_values',
              text,
              count=1,
          )
          if n != 1:
              raise RuntimeError('fallback tests replacement failed')
          text = text.replace(
              'fn yt_dlp_staging_name_is_short_and_title_independent()',
              'fn streamlink_staging_name_is_short_and_title_independent()',
          )

          path.write_text(text, encoding='utf-8')
          '@ | Set-Content -LiteralPath $env:RUNNER_TEMP\phase18_streamlink_refactor.py -Encoding UTF8
          python $env:RUNNER_TEMP\phase18_streamlink_refactor.py
          if ($LASTEXITCODE -ne 0) { throw "source refactor failed: $LASTEXITCODE" }
          rustfmt --edition 2024 rust-web/src/platform/chzzk/vod.rs
          if ($LASTEXITCODE -ne 0) { throw 'rustfmt apply failed' }

          $source = Get-Content -LiteralPath rust-web/src/platform/chzzk/vod.rs -Raw -Encoding UTF8
          if ($source -notmatch 'struct ChzzkTools') { throw 'ChzzkTools missing after refactor' }
          if ($source -notmatch 'run_streamlink_process') { throw 'Streamlink transport missing after refactor' }
          if ($source -match '"--dump-single-json"|"--merge-output-format"|run_ffmpeg_fallback') {
            throw 'legacy yt-dlp/public DASH fallback remains in CHZZK provider'
          }

      - name: Rust tests and check
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          rustfmt --edition 2024 --check rust-web/src/platform/chzzk/vod.rs
          if ($LASTEXITCODE -ne 0) { throw 'rustfmt check failed' }
          cargo test --locked --manifest-path rust-web/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }
          cargo check --locked --manifest-path rust-web/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo check failed' }

      - name: Verify public CHZZK Streamlink
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $streamlink = 'C:\Program Files\Streamlink\bin\streamlink.exe'
          $json = & $streamlink --no-config --json 'https://chzzk.naver.com/video/15185683'
          if ($LASTEXITCODE -ne 0) { throw 'streamlink json failed' }
          $obj = $json | ConvertFrom-Json
          $names = @($obj.streams.PSObject.Properties.Name)
          Write-Host "qualities=$($names -join ',')"
          if ($names -notcontains '1080p') { throw '1080p missing' }
          $out = Join-Path $env:RUNNER_TEMP 'chzzk-vod-streamlink-smoke.ts'
          Remove-Item $out -Force -ErrorAction SilentlyContinue
          & $streamlink --no-config --stream-segmented-duration 8 --output $out 'https://chzzk.naver.com/video/15185683' best
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out)) { throw 'streamlink download smoke failed' }
          if ((Get-Item $out).Length -lt 1880) { throw 'streamlink output too small' }
          Remove-Item $out -Force -ErrorAction SilentlyContinue

      - name: Commit source refactor
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust-web/src/platform/chzzk/vod.rs
          if (git diff --cached --quiet) {
            Write-Host 'Source refactor already committed; nothing to push.'
            exit 0
          }
          git commit -m 'Use Streamlink for CHZZK VOD transport'
          if ($LASTEXITCODE -ne 0) { throw 'commit failed' }
          git push origin HEAD:phase18-chzzk-vod
          if ($LASTEXITCODE -ne 0) { throw 'push failed' }
