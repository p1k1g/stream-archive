name: Phase 18 CHZZK VOD check

on:
  pull_request:
    branches:
      - main
    paths:
      - "rust-web/src/main.rs"
      - "rust-web/src/platform/**"
      - "rust-web/src/vod.rs"
      - "rust-web/src/vod_queue.rs"
      - "rust-web/web/**"
      - "maintenance/Test-Phase18ChzzkVod.ps1"
      - ".github/workflows/phase18-chzzk-vod-check.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase18-chzzk-vod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase18-guard:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Normalize CHZZK VOD error message encoding and validate
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $vodPath = 'rust-web/src/platform/chzzk/vod.rs'
          $vod = Get-Content -LiteralPath $vodPath -Raw -Encoding UTF8
          $pattern = '(?s)fn root_creation_lock\(root: &Path\) -> Result<File> \{.*?\r?\n\}\r?\n\r?\nfn cleanup_stale_job_dirs\(backend: &Path\) -> Result<\(\)> \{.*?\r?\n\}\r?\n\r?\nfn job_dir\(backend: &Path\) -> Result<JobDirGuard> \{.*?\r?\n\}\r?\n\r?\n#\[cfg\(windows\)\]'
          $replacement = @'
          fn root_creation_lock(root: &Path) -> Result<File> {
              let lock_path = root.join(JOB_CREATION_LOCK_FILE_NAME);
              let lock = OpenOptions::new()
                  .read(true)
                  .write(true)
                  .create(true)
                  .open(&lock_path)
                  .with_context(|| {
                      format!(
                          "CHZZK VOD creation lock \u{c5f4}\u{ae30} \u{c2e4}\u{d328}: {}",
                          lock_path.display()
                      )
                  })?;
              lock.lock_exclusive()
                  .context("CHZZK VOD creation lock \u{d68d}\u{b4dd} \u{c2e4}\u{d328}")?;
              Ok(lock)
          }

          fn cleanup_stale_job_dirs(backend: &Path) -> Result<()> {
              let root = vod_job_root(backend);
              if !root.is_dir() {
                  return Ok(());
              }
              let creation_lock = root_creation_lock(&root)?;
              for entry in fs::read_dir(&root).with_context(|| {
                  format!(
                      "CHZZK VOD \u{c784}\u{c2dc} \u{d3f4}\u{b354} \u{c870}\u{d68c} \u{c2e4}\u{d328}: {}",
                      root.display()
                  )
              })? {
                  let entry = entry?;
                  if !entry.file_type()?.is_dir() {
                      continue;
                  }
                  let name = entry.file_name();
                  if !name.to_string_lossy().starts_with("chzzk-") {
                      continue;
                  }
                  let dir = entry.path();
                  let lock_path = dir.join(JOB_LOCK_FILE_NAME);
                  if !lock_path.is_file() {
                      let _ = fs::remove_dir_all(&dir);
                      continue;
                  }
                  let lock = match OpenOptions::new().read(true).write(true).open(&lock_path) {
                      Ok(lock) => lock,
                      Err(_) => continue,
                  };
                  match lock.try_lock_exclusive() {
                      Ok(()) => {
                          let _ = FileExt::unlock(&lock);
                          drop(lock);
                          let _ = fs::remove_dir_all(&dir);
                      }
                      Err(err) if is_lock_contention(&err) => {}
                      Err(_) => {}
                  }
              }
              let _ = FileExt::unlock(&creation_lock);
              Ok(())
          }

          fn job_dir(backend: &Path) -> Result<JobDirGuard> {
              let root = vod_job_root(backend);
              fs::create_dir_all(&root).with_context(|| {
                  format!(
                      "CHZZK VOD \u{c784}\u{c2dc} \u{b8e8}\u{d2b8} \u{c0dd}\u{c131} \u{c2e4}\u{d328}: {}",
                      root.display()
                  )
              })?;
              let creation_lock = root_creation_lock(&root)?;
              let id = Uuid::new_v4().simple().to_string();
              let preparing = root.join(format!(".chzzk-creating-{id}"));
              let dir = root.join(format!("chzzk-{id}"));
              fs::create_dir(&preparing).with_context(|| {
                  format!(
                      "CHZZK VOD \u{c784}\u{c2dc} \u{d3f4}\u{b354} \u{c0dd}\u{c131} \u{c2e4}\u{d328}: {}",
                      preparing.display()
                  )
              })?;
              if let Err(err) = restrict_job_dir(&preparing) {
                  let _ = fs::remove_dir_all(&preparing);
                  return Err(err);
              }
              let preparing_lock_path = preparing.join(JOB_LOCK_FILE_NAME);
              let preparing_lock = match OpenOptions::new()
                  .read(true)
                  .write(true)
                  .create_new(true)
                  .open(&preparing_lock_path)
              {
                  Ok(lock) => lock,
                  Err(err) => {
                      let _ = fs::remove_dir_all(&preparing);
                      return Err(err).with_context(|| {
                          format!(
                              "CHZZK VOD ownership lock \u{c0dd}\u{c131} \u{c2e4}\u{d328}: {}",
                              preparing_lock_path.display()
                          )
                      });
                  }
              };
              if let Err(err) = restrict_cookie_file(&preparing_lock_path) {
                  drop(preparing_lock);
                  let _ = fs::remove_dir_all(&preparing);
                  return Err(err);
              }
              drop(preparing_lock);
              if let Err(err) = fs::rename(&preparing, &dir) {
                  let _ = fs::remove_dir_all(&preparing);
                  return Err(err).with_context(|| {
                      format!(
                          "CHZZK VOD \u{c784}\u{c2dc} \u{d3f4}\u{b354} publish \u{c2e4}\u{d328}: {} -> {}",
                          preparing.display(),
                          dir.display()
                      )
                  });
              }
              let lock_path = dir.join(JOB_LOCK_FILE_NAME);
              let lock = match OpenOptions::new().read(true).write(true).open(&lock_path) {
                  Ok(lock) => lock,
                  Err(err) => {
                      let _ = fs::remove_dir_all(&dir);
                      return Err(err).with_context(|| {
                          format!(
                              "CHZZK VOD ownership lock \u{c5f4}\u{ae30} \u{c2e4}\u{d328}: {}",
                              lock_path.display()
                          )
                      });
                  }
              };
              if let Err(err) = lock.lock_exclusive() {
                  drop(lock);
                  let _ = fs::remove_dir_all(&dir);
                  return Err(err).context(
                      "CHZZK VOD ownership lock \u{d68d}\u{b4dd} \u{c2e4}\u{d328}",
                  );
              }
              let _ = FileExt::unlock(&creation_lock);
              drop(creation_lock);
              Ok(JobDirGuard { path: dir, lock })
          }

          #[cfg(windows)]
          '@
          $updated = [regex]::Replace($vod, $pattern, $replacement, 1)
          if ($updated -eq $vod) { throw 'job directory block replacement failed' }
          [System.IO.File]::WriteAllText((Resolve-Path $vodPath), $updated, (New-Object System.Text.UTF8Encoding($false)))

          rustfmt --edition 2024 $vodPath
          if ($LASTEXITCODE -ne 0) { throw 'rustfmt failed' }
          ./maintenance/Test-Phase18ChzzkVod.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Phase 18 guard failed' }
          cargo test --locked --manifest-path rust-web/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }
          cargo check --locked --manifest-path rust-web/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo check failed' }
          git diff --check -- $vodPath
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $vodPath
          git commit -m "Normalize CHZZK VOD error message encoding"
          git push origin HEAD:${{ github.head_ref }}
