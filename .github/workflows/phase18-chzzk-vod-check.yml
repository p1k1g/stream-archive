name: Phase 18 CHZZK VOD check

on:
  pull_request:
    branches:
      - main
    paths:
      - "rust-web/src/main.rs"
      - "rust-web/src/platform/**"
      - "rust-web/src/vod.rs"
      - "rust-web/src/vod_queue.rs"
      - "rust-web/web/**"
      - "maintenance/Test-Phase18ChzzkVod.ps1"
      - ".github/workflows/phase18-chzzk-vod-check.yml"
  workflow_dispatch:

concurrency:
  group: phase18-chzzk-vod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase18-guard:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe public CHZZK VOD playback fallback
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($videoNo in @('15185683','15028162')) {
            $detail = Invoke-RestMethod -Uri "https://api.chzzk.naver.com/service/v3/videos/$videoNo" -Method Get
            $c = $detail.content
            Write-Host "video=$videoNo code=$($detail.code) vodStatus=$($c.vodStatus) adult=$($c.adult) membership=$($c.membershipBenefitType) hasInKey=$([bool]$c.inKey) hasRewind=$([bool]$c.liveRewindPlaybackJson)"
            $rewind = $c.liveRewindPlaybackJson
            if (-not $rewind) {
              try {
                $auto = Invoke-RestMethod -Uri "https://api.chzzk.naver.com/service/v1/videos/$videoNo/live-rewind/auto-play-info" -Method Get
                if ($auto.content -and $auto.content.liveRewindPlaybackJson) { $rewind = $auto.content.liveRewindPlaybackJson }
                elseif ($auto.liveRewindPlaybackJson) { $rewind = $auto.liveRewindPlaybackJson }
              } catch {
                Write-Host "video=$videoNo autoPlayError=$($_.Exception.Message)"
              }
            }
            if ($rewind) {
              $p = $rewind | ConvertFrom-Json
              foreach ($m in @($p.media)) {
                if ($m.path) {
                  $u = [Uri]$m.path
                  Write-Host "video=$videoNo mediaId=$($m.mediaId) protocol=$($m.protocol) host=$($u.Host) tracks=$(@($m.encodingTrack).Count)"
                }
              }
            }
          }

      - name: Phase 18 CHZZK VOD guard
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./maintenance/Test-Phase18ChzzkVod.ps1

      - name: CHZZK VOD provider format
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: rustfmt --edition 2024 --check rust-web/src/platform/chzzk/vod.rs
