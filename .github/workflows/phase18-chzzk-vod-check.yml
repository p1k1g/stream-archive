name: Phase 18 CHZZK VOD check

on:
  pull_request:
    branches:
      - main
    paths:
      - "rust-web/src/main.rs"
      - "rust-web/src/platform/**"
      - "rust-web/src/vod.rs"
      - "rust-web/src/vod_queue.rs"
      - "rust-web/web/**"
      - "maintenance/Test-Phase18ChzzkVod.ps1"
      - ".github/workflows/phase18-chzzk-vod-check.yml"
  workflow_dispatch:

concurrency:
  group: phase18-chzzk-vod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase18-guard:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify public CHZZK DASH with ffprobe
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $detail = Invoke-RestMethod -Uri 'https://api.chzzk.naver.com/service/v3/videos/15185683' -Method Get
          $c = $detail.content
          $key = [System.Uri]::EscapeDataString([string]$c.inKey)
          $url = "https://apis.naver.com/neonplayer/vodplay/v1/playback/$($c.videoId)?key=$key&env=real&lc=en_US&cpl=en_US"
          $ffprobe = (Get-Command ffprobe.exe -ErrorAction SilentlyContinue).Source
          if (-not $ffprobe) {
            $ffprobe = Get-ChildItem 'C:\Program Files\Streamlink' -Filter ffprobe.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $ffprobe) { throw 'ffprobe.exe not found on Windows runner' }
          Write-Host "ffprobe=$ffprobe"
          & $ffprobe -v error -show_entries 'stream=index,codec_type,width,height,channels' -of csv=p=0 $url
          if ($LASTEXITCODE -ne 0) { throw "ffprobe DASH probe failed: exit=$LASTEXITCODE" }

      - name: Phase 18 CHZZK VOD guard
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./maintenance/Test-Phase18ChzzkVod.ps1

      - name: CHZZK VOD provider format
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: rustfmt --edition 2024 --check rust-web/src/platform/chzzk/vod.rs
