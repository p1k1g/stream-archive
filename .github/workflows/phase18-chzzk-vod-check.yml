name: Phase 18 CHZZK VOD check

on:
  pull_request:
    branches:
      - main
    paths:
      - "rust-web/src/main.rs"
      - "rust-web/src/platform/**"
      - "rust-web/src/vod.rs"
      - "rust-web/src/vod_queue.rs"
      - "rust-web/web/**"
      - "maintenance/Test-Phase18ChzzkVod.ps1"
      - ".github/workflows/phase18-chzzk-vod-check.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase18-chzzk-vod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase18-guard:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Harden and push CHZZK public DASH fallback
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'rust-web/src/platform/chzzk/vod.rs'
          $src = Get-Content -LiteralPath $path -Raw -Encoding UTF8

          $oldErr = @'
                  Err(err) => {
                      if let Ok(fallback) = load_public_playback_fallback(vod_url).await {
                          logs.push(
                              "[VOD:CHZZK] yt-dlp metadata failed; using public CHZZK playback fallback",
                          )
                          .await;
                          return Ok(fallback.metadata);
                      }
                      if is_source_url_extractor_bug(&err) {
                          return Err(err).context(
                              "yt-dlp CHZZK DASH parser hit the known sourceURL bug and the public playback fallback was unavailable",
                          );
                      }
                      let state = ChzzkAuth::load()
          '@
          $newErr = @'
                  Err(err) => {
                      if is_source_url_extractor_bug(&err) {
                          match load_public_playback_fallback(vod_url).await {
                              Ok(fallback) => {
                                  logs.push(
                                      "[VOD:CHZZK] yt-dlp sourceURL bug detected; using public CHZZK playback fallback",
                                  )
                                  .await;
                                  return Ok(fallback.metadata);
                              }
                              Err(fallback_err) => {
                                  return Err(err).context(format!(
                                      "yt-dlp CHZZK DASH parser hit the known sourceURL bug and the public fallback lookup also failed: {fallback_err:#}"
                                  ));
                              }
                          }
                      }
                      let state = ChzzkAuth::load()
          '@
          if (-not $src.Contains($oldErr)) { throw 'metadata fallback error block not found' }
          $src = $src.Replace($oldErr, $newErr)

          $duplicate = @'
              text.contains("KeyError('sourceURL')")
                  || text.contains("KeyError(\"sourceURL\")")
                  || text.contains("KeyError('sourceURL')")
          '@
          $deduped = @'
              text.contains("KeyError('sourceURL')") || text.contains("KeyError(\"sourceURL\")")
          '@
          if (-not $src.Contains($duplicate)) { throw 'sourceURL classifier block not found' }
          $src = $src.Replace($duplicate, $deduped)

          $oldUrl = @'
                  let mut url = Url::parse(&format!(
                      "https://apis.naver.com/neonplayer/vodplay/v1/playback/{media_id}"
                  ))?;
                  url.query_pairs_mut()
                      .append_pair("key", in_key)
                      .append_pair("env", "real")
                      .append_pair("lc", "en_US")
                      .append_pair("cpl", "en_US");
          '@
          $newUrl = @'
                  let mut url = Url::parse(&format!(
                      "https://apis.naver.com/neonplayer/vodplay/v2/playback/{media_id}"
                  ))?;
                  url.query_pairs_mut().append_pair("key", in_key);
          '@
          if (-not $src.Contains($oldUrl)) { throw 'neonplayer URL block not found' }
          $src = $src.Replace($oldUrl, $newUrl)

          $oldDate = @'
              let date = content
                  .get("publishDate")
                  .and_then(Value::as_str)
                  .and_then(short_date)
                  .unwrap_or_else(today_short_date);
          '@
          $newDate = @'
              let date = content
                  .get("publishDate")
                  .and_then(Value::as_str)
                  .and_then(short_date)
                  .or_else(|| {
                      content
                          .get("publishDateAt")
                          .and_then(|value| {
                              value
                                  .as_i64()
                                  .or_else(|| value.as_f64().map(|number| number as i64))
                          })
                          .and_then(chrono::DateTime::<Utc>::from_timestamp_millis)
                          .map(|timestamp| {
                              let local = timestamp.with_timezone(&Local);
                              format!(
                                  "{:02}{:02}{:02}",
                                  local.year() % 100,
                                  local.month(),
                                  local.day()
                              )
                          })
                  })
                  .unwrap_or_else(today_short_date);
          '@
          if (-not $src.Contains($oldDate)) { throw 'public metadata date block not found' }
          $src = $src.Replace($oldDate, $newDate)

          $oldInput = @'
                  .arg("-y")
                  .arg("-i")
                  .arg(playback_url)
          '@
          $newInput = @'
                  .arg("-y")
                  .arg("-headers")
                  .arg("Accept: application/dash+xml\r\n")
                  .arg("-i")
                  .arg(playback_url)
          '@
          if (-not $src.Contains($oldInput)) { throw 'ffmpeg input args block not found' }
          $src = $src.Replace($oldInput, $newInput)

          $oldTest = 'assert!(fallback.playback_url.contains("/playback/ABCDEF012345?"));'
          $newTest = 'assert!(fallback.playback_url.contains("/vodplay/v2/playback/ABCDEF012345?"));'
          if (-not $src.Contains($oldTest)) { throw 'fallback URL test assertion not found' }
          $src = $src.Replace($oldTest, $newTest)

          [System.IO.File]::WriteAllText((Resolve-Path $path), $src, (New-Object System.Text.UTF8Encoding($false)))
          rustfmt --edition 2024 $path
          if ($LASTEXITCODE -ne 0) { throw 'rustfmt failed' }
          ./maintenance/Test-Phase18ChzzkVod.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Phase 18 guard failed' }
          cargo test --locked --manifest-path rust-web/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }
          cargo check --locked --manifest-path rust-web/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo check failed' }
          git diff --check -- $path
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $path
          git commit -m "Harden CHZZK public DASH fallback"
          git push origin HEAD:${{ github.head_ref }}
