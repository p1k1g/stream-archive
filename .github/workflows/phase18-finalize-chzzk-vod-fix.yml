name: Phase 18 finalize CHZZK VOD fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase18-finalize-chzzk-vod-fix.yml"
      - ".github/scripts/phase18_finalize_chzzk_vod_fix.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase18-finalize-chzzk-vod-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase18-chzzk-vod
          fetch-depth: 0

      - name: Apply final progress and duration UI cleanup
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          python .github/scripts/phase18_finalize_chzzk_vod_fix.py
          if ($LASTEXITCODE -ne 0) { throw 'final patch failed' }
          rustfmt --edition 2024 rust-web/src/platform/chzzk/vod.rs
          if ($LASTEXITCODE -ne 0) { throw 'rustfmt apply failed' }
          node --check rust-web/web/app.js
          if ($LASTEXITCODE -ne 0) { throw 'app.js syntax failed' }

      - name: Validate final Phase 18 state
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          & ./maintenance/Test-Phase18ChzzkVod.ps1
          if (-not $?) { throw 'Phase 18 guard failed' }
          rustfmt --edition 2024 --check rust-web/src/platform/chzzk/vod.rs
          if ($LASTEXITCODE -ne 0) { throw 'rustfmt check failed' }
          cargo test --locked --manifest-path rust-web/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }
          cargo check --locked --manifest-path rust-web/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo check failed' }

      - name: Commit final state without temporary diagnostics
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust-web/src/platform/chzzk/vod.rs rust-web/web/app.js maintenance/Test-Phase18ChzzkVod.ps1
          $temporary = @(
            '.github/scripts/phase18_pipe_diagnose.py',
            '.github/workflows/phase18-chzzk-vod-diagnose.yml',
            '.github/scripts/phase18_chzzk_vod_pipeline_fix.py',
            '.github/workflows/phase18-chzzk-vod-pipeline-fix.yml',
            '.github/scripts/phase18_finalize_chzzk_vod_fix.py',
            '.github/workflows/phase18-finalize-chzzk-vod-fix.yml'
          )
          foreach ($path in $temporary) {
            if (Test-Path -LiteralPath $path) { git rm -f -- $path }
          }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff check failed' }
          git commit -m 'Finalize CHZZK VOD duration and progress fixes'
          if ($LASTEXITCODE -ne 0) { throw 'commit failed' }
          git push origin HEAD:phase18-chzzk-vod
          if ($LASTEXITCODE -ne 0) { throw 'push failed' }
