name: Phase 18 final Codex fix

on:
  push:
    branches:
      - phase18-chzzk-vod
    paths:
      - .github/scripts/phase18_codex_review_fix.py
      - .github/workflows/phase18-codex-final-fix.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase18-chzzk-vod
          fetch-depth: 0

      - name: Apply final Codex fixes
        shell: powershell
        run: |
          python .github/scripts/phase18_codex_review_fix.py
          if ($LASTEXITCODE -ne 0) { throw 'patch failed' }
          rustfmt --edition 2024 rust-web/src/platform/chzzk/vod.rs
          if ($LASTEXITCODE -ne 0) { throw 'rustfmt failed' }

      - name: Phase 18 guard
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File maintenance/Test-Phase18ChzzkVod.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Phase 18 guard failed' }

      - name: Rust unit tests
        shell: powershell
        run: |
          cargo test --locked --manifest-path rust-web/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }

      - name: Rust check
        shell: powershell
        run: |
          cargo check --locked --manifest-path rust-web/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo check failed' }

      - name: Diff check
        shell: powershell
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }

      - name: Commit and push functional fix
        shell: powershell
        run: |
          git config user.name "starft8900"
          git config user.email "96937577+starft8900@users.noreply.github.com"
          git add rust-web/src/platform/chzzk/vod.rs maintenance/Test-Phase18ChzzkVod.ps1
          git diff --cached --exit-code
          if ($LASTEXITCODE -eq 0) { throw 'No functional changes produced by patch' }
          git commit -m "Fix final Phase 18 Codex review findings"
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
          git push origin HEAD:phase18-chzzk-vod
          if ($LASTEXITCODE -ne 0) { throw 'git push failed' }
