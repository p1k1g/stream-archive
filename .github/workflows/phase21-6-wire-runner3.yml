name: Phase 21.6 simple wiring runner

on:
  push:
    branches:
      - phase21-queue-history

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase21-queue-history
          fetch-depth: 0

      - name: Skip generated wiring commit
        id: gate
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[phase21-wire\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch native UI and controller
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {label}')
              return text.replace(old, new, 1)

          ui_path = Path('rust-gui/ui/app-window.slint')
          ui = ui_path.read_text()
          if 'queue-history.slint' not in ui:
              ui = one(ui,
                  'import { Button, LineEdit, ScrollView } from "std-widgets.slint";\n',
                  'import { Button, LineEdit, ScrollView } from "std-widgets.slint";\nimport { QueuePage, HistoryPage, QueueHistoryState } from "queue-history.slint";\n',
                  'queue/history import')
          if 'QueueHistoryState.enqueue-current();' not in ui:
              anchor = '                                            clicked => { AppState.vod-download(); }\n                                        }\n'
              ui = one(ui, anchor, anchor + '''                                        Button {
                                            height: 32px;
                                            text: "Add to Queue";
                                            enabled: AppState.vod-loaded && AppState.vod-can-download && !AppState.vod-busy && !AppState.vod-running;
                                            clicked => { QueueHistoryState.enqueue-current(); }
                                        }
''', 'add to queue')
          placeholders = '''                if AppState.active-page == "Queue": PlaceholderPage {
                    title: "Queue";
                    description: "Queue state and lifecycle controls move here after reusable queue services are separated from the Axum adapter.";
                    vertical-stretch: 1;
                }
                if AppState.active-page == "History": PlaceholderPage {
                    title: "History";
                    description: "LIVE/VOD history browsing and filtering move here in Phase 21.6.";
                    vertical-stretch: 1;
                }
'''
          if placeholders in ui:
              ui = ui.replace(placeholders,
                  '                if AppState.active-page == "Queue": QueuePage { vertical-stretch: 1; }\n                if AppState.active-page == "History": HistoryPage { vertical-stretch: 1; }\n', 1)
          ui_path.write_text(ui)

          stored = Path('.github/workflows/phase21-6-wire.yml').read_text()
          start = stored.index('          from pathlib import Path\n')
          end = stored.index('\n          PY\n\n      - name: Format Rust', start)
          block = stored[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          controller_marker = '# ---- Native controller ------------------------------------------'
          controller_code = 'from pathlib import Path\n\n' + code.split(controller_marker, 1)[1]
          exec(compile(controller_code, 'phase21-6-controller-wire.py', 'exec'))
          PY

      - name: Format Rust
        if: steps.gate.outputs.skip != 'true'
        run: cargo fmt --manifest-path rust-gui/Cargo.toml

      - name: Commit wiring
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No wiring changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust-gui/ui/app-window.slint rust-gui/src/controller.rs
          git commit -m "[phase21-wire] Wire native Queue and History screens"
          git push origin HEAD:phase21-queue-history
