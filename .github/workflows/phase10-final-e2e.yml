name: Phase10 final E2E

on:
  push:
    branches:
      - phase10-session-auth
    paths:
      - ".github/workflows/phase10-final-e2e.yml"

jobs:
  windows-e2e:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Format, unit tests and compile check
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          cargo fmt --manifest-path rust-web/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt --check failed' }
          cargo test --locked --manifest-path rust-web/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }
          cargo check --locked --manifest-path rust-web/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo check failed' }

      - name: Verify Streamlink recorder options
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $streamlink = 'C:\Program Files\Streamlink\bin\streamlink.exe'
          if (-not (Test-Path -LiteralPath $streamlink -PathType Leaf)) { throw "Streamlink not found: $streamlink" }
          $help = & $streamlink --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'streamlink --help failed' }
          foreach ($option in @('--progress','--stream-segmented-queue-deadline','--stream-timeout')) {
            if ($help -notmatch [regex]::Escape($option)) { throw "Streamlink option unavailable: $option" }
          }

      - name: Build portable package
        shell: cmd
        run: PACKAGE_RUST_WEB.bat

      - name: Browser-session HTTP E2E
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path '.').Path
          $package = Join-Path $root 'dist\soop-recorder'
          $backend = Join-Path $package 'backend'
          $data = Join-Path $root 'dist\phase10-e2e-data'
          if (Test-Path -LiteralPath $data) { Remove-Item -LiteralPath $data -Recurse -Force }
          New-Item -ItemType Directory -Path $data | Out-Null

          $env:SOOP_BACKEND_DIR = $backend
          $env:SOOP_DATA_DIR = $data
          $env:SOOP_WEB_BIND = '127.0.0.1:18787'
          $env:SOOP_START_WATCHER = '0'
          $env:SOOP_WEB_TOKEN = 'phase10-e2e-recovery-token-0123456789abcdef'
          $server = Start-Process -FilePath (Join-Path $package 'soop-server.exe') -WorkingDirectory $package -PassThru -WindowStyle Hidden
          try {
            $base = 'http://127.0.0.1:18787'
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $r = Invoke-WebRequest -Uri "$base/api/auth/status" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'server did not become ready' }

            try {
              Invoke-WebRequest -Uri "$base/api/status" -UseBasicParsing -TimeoutSec 5 | Out-Null
              throw 'protected API unexpectedly allowed anonymous request'
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 401) { throw }
            }

            $setupBody = @{ username='e2e_admin'; password='Phase10-E2E-Password!'; password_confirm='Phase10-E2E-Password!' } | ConvertTo-Json
            $setup = Invoke-WebRequest -Uri "$base/api/auth/setup" -Method Post -ContentType 'application/json' -Body $setupBody -SessionVariable webSession -UseBasicParsing
            if ($setup.StatusCode -ne 200) { throw "setup failed: $($setup.StatusCode)" }
            $setupJson = $setup.Content | ConvertFrom-Json
            if (-not $setupJson.authenticated) { throw 'setup did not authenticate session' }
            $csrf = [string]$setupJson.csrf_token
            if ([string]::IsNullOrWhiteSpace($csrf)) { throw 'setup response missing CSRF token' }

            $auth1 = Invoke-RestMethod -Uri "$base/api/auth/status" -WebSession $webSession -Method Get
            if (-not $auth1.authenticated -or $auth1.username -ne 'e2e_admin') { throw 'session status failed after setup' }

            # A second independent HTTP request with the same cookie jar represents browser refresh/session persistence.
            $auth2 = Invoke-RestMethod -Uri "$base/api/auth/status" -WebSession $webSession -Method Get
            if (-not $auth2.authenticated -or [string]::IsNullOrWhiteSpace([string]$auth2.csrf_token)) { throw 'session did not persist across requests' }

            $headers = @{ 'x-csrf-token' = $csrf }
            $protected = Invoke-RestMethod -Uri "$base/api/status" -WebSession $webSession -Headers $headers -Method Get
            if ($protected.phase -ne 'phase10-session-auth') { throw 'protected API returned unexpected phase' }

            $logout = Invoke-RestMethod -Uri "$base/api/auth/logout" -WebSession $webSession -Headers $headers -Method Post
            if (-not $logout.ok) { throw 'logout response was not ok' }

            $after = Invoke-RestMethod -Uri "$base/api/auth/status" -WebSession $webSession -Method Get
            if ($after.authenticated) { throw 'session remained authenticated after logout' }

            try {
              Invoke-WebRequest -Uri "$base/api/status" -WebSession $webSession -Headers $headers -UseBasicParsing -TimeoutSec 5 | Out-Null
              throw 'protected API unexpectedly allowed request after logout'
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 401) { throw }
            }

            Write-Host 'Phase10 session E2E: PASS'
          } finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
              Wait-Process -Id $server.Id -ErrorAction SilentlyContinue
            }
          }
