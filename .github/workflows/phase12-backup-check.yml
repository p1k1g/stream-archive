name: Phase 12 backup retention validation

on:
  push:
    branches: [phase12-backup-retention]
    paths:
      - .github/workflows/phase12-backup-check.yml

jobs:
  validate:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase12-backup-retention
      - name: JavaScript syntax checks
        shell: cmd
        run: |
          "C:\github-runner\externals\node24\bin\node.exe" --check rust-web\web\app.js
          "C:\github-runner\externals\node24\bin\node.exe" --check rust-web\web\phase8.js
          "C:\github-runner\externals\node24\bin\node.exe" --check rust-web\web\phase10.js
          "C:\github-runner\externals\node24\bin\node.exe" --check rust-web\web\phase12.js
      - name: Rust format check
        shell: cmd
        run: cargo fmt --manifest-path rust-web\Cargo.toml -- --check
      - name: Rust unit tests
        shell: cmd
        run: cargo test --locked --manifest-path rust-web\Cargo.toml
      - name: Windows native compile check
        shell: cmd
        run: cargo check --locked --manifest-path rust-web\Cargo.toml
      - name: Windows portable package smoke
        shell: cmd
        run: PACKAGE_RUST_WEB.bat
      - name: Verify portable package
        shell: cmd
        run: |
          if not exist dist\soop-recorder\soop-server.exe exit /b 1
          if not exist dist\soop-recorder\soop-launcher.exe exit /b 1
          if not exist dist\soop-recorder\RUN.bat exit /b 1
          if not exist dist\soop-recorder\BACKUP_DATA.bat exit /b 1
          if not exist dist\soop-recorder\RESTORE_DATA.bat exit /b 1
          if not exist dist\soop-recorder\SHA256SUMS.txt exit /b 1
