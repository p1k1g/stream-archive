name: Phase10 dead-code cleanup

on:
  push:
    branches:
      - phase10-session-auth
    paths:
      - ".github/workflows/phase10-deadcode-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup-and-test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase10-session-auth
          fetch-depth: 0

      - name: Clean dead code
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          function Read-Utf8([string]$Path) { [IO.File]::ReadAllText($Path) }
          function Write-Utf8([string]$Path, [string]$Text) { [IO.File]::WriteAllText($Path, $Text, [Text.UTF8Encoding]::new($false)) }
          function Replace-Required([string]$Text, [string]$Old, [string]$New, [string]$Label) {
            if (-not $Text.Contains($Old)) { throw "replacement target not found: $Label" }
            return $Text.Replace($Old, $New)
          }
          function Regex-Replace-Required([string]$Text, [string]$Pattern, [string]$Replacement, [string]$Label) {
            $rx = [regex]::new($Pattern, [Text.RegularExpressions.RegexOptions]::Singleline)
            if (-not $rx.IsMatch($Text)) { throw "regex target not found: $Label" }
            return $rx.Replace($Text, $Replacement, 1)
          }

          $p = 'rust-web/src/auth.rs'
          $t = Read-Utf8 $p
          $t = Replace-Required $t 'sync::{Mutex, MutexGuard},' 'sync::Mutex,' 'auth unused MutexGuard'
          Write-Utf8 $p $t

          $p = 'rust-web/src/backend.rs'
          $t = Read-Utf8 $p
          $t = Replace-Required $t 'use atomic_write_file::AtomicWriteFile;' "#[cfg(test)]`nuse atomic_write_file::AtomicWriteFile;" 'backend atomic writer import'
          $t = Regex-Replace-Required $t '(?m)^\s{4}io::Write,\r?\n' '' 'backend io::Write tree import'
          $t = Replace-Required $t 'use tokio::sync::RwLock;' "use tokio::sync::RwLock;`n#[cfg(test)]`nuse std::io::Write;" 'backend test Write import'
          foreach ($sig in @(
            'pub fn update_settings(',
            'fn validate_setting_updates(',
            'fn validate_int(',
            'fn validate_yes_no(',
            'pub fn write_channels(',
            'fn validate_channel(',
            'fn validate_single_line(',
            'fn preferred_newline(',
            'fn backup_existing(',
            'fn write_atomic('
          )) {
            $t = Replace-Required $t $sig ("#[cfg(test)]`n" + $sig) ("backend test-only " + $sig)
          }
          Write-Utf8 $p $t

          $p = 'rust-web/src/primary_config.rs'
          $t = Read-Utf8 $p
          $t = Regex-Replace-Required $t 'pub fn vod_tool_values\(.*?\r?\n\}\r?\n\r?\n(?=pub fn apply_vod_tool_defaults)' '' 'remove unused vod_tool_values'
          Write-Utf8 $p $t

          $p = 'rust-web/src/security.rs'
          $t = Read-Utf8 $p
          $t = Regex-Replace-Required $t '(?m)^use atomic_write_file::AtomicWriteFile;\r?\n' '' 'remove unused atomic writer import'
          $t = Regex-Replace-Required $t '(?m)^use std::\{fs, io::Write, path::\{Path, PathBuf\}\};$' "#[cfg(test)]`nuse std::{fs, path::Path};" 'security test-only imports'
          $t = Replace-Required $t 'const SECRET_KEYS: &[&str] = &["SOOP_PASSWORD", "CLOUDFLARE_API_KEY"];' "#[cfg(test)]`nconst SECRET_KEYS: &[&str] = &[\"SOOP_PASSWORD\", \"CLOUDFLARE_API_KEY\"];" 'security test-only keys'
          $t = Replace-Required $t 'pub fn configured_secrets(' "#[cfg(test)]`npub fn configured_secrets(" 'security configured_secrets test-only'
          $t = Regex-Replace-Required $t 'pub fn save_protected_secrets\(.*?(?=#\[cfg\(windows\)\]\r?\nfn platform_protect)' '' 'remove unused legacy secret writer'
          Write-Utf8 $p $t

          $p = 'rust-web/src/store.rs'
          $t = Read-Utf8 $p
          $t = Replace-Required $t 'model::{Channel, HistoryResponse, LiveHistoryItem, VodHistoryItem, VodJobStatus},' 'model::{Channel, LiveHistoryItem, VodJobStatus},' 'store unused history imports'
          $t = Regex-Replace-Required $t '(?m)^\s{4}pub database: PathBuf,\r?\n' '' 'store unused migration database field'
          $t = [regex]::Replace($t, '(?m)^\s+database: self\.path\.clone\(\),\r?\n', '')
          $t = Regex-Replace-Required $t '    pub fn history\(&self, limit: usize\).*?(?=    pub fn setting_value)' '' 'remove unused unfiltered history method'
          Write-Utf8 $p $t

          $p = 'rust-web/src/vod_tool_settings.rs'
          $t = Read-Utf8 $p
          $t = Replace-Required $t 'use anyhow::{bail, Context, Result};' "use anyhow::{Context, Result};`n#[cfg(test)]`nuse anyhow::bail;" 'vod tool test-only bail import'
          $t = Replace-Required $t 'use atomic_write_file::AtomicWriteFile;' "#[cfg(test)]`nuse atomic_write_file::AtomicWriteFile;" 'vod tool test-only atomic writer'
          $t = Regex-Replace-Required $t '(?m)^\s{4}io::Write,\r?\n' '' 'vod tool io::Write tree import'
          $t = Regex-Replace-Required $t '(?m)^\};\r?\n\r?\nconst FILE_NAME' "};`n#[cfg(test)]`nuse std::io::Write;`n`nconst FILE_NAME" 'vod tool test-only Write import'
          foreach ($sig in @('pub fn update(', 'pub fn apply_defaults(', 'fn backup_existing(')) {
            $t = Replace-Required $t $sig ("#[cfg(test)]`n" + $sig) ("vod tool test-only " + $sig)
          }
          Write-Utf8 $p $t

          cargo fmt --manifest-path rust-web/Cargo.toml
          git diff --check
          git diff -- rust-web/src

      - name: Rust unit tests
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: cargo test --locked --manifest-path rust-web/Cargo.toml

      - name: Windows native compile check
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: cargo check --locked --manifest-path rust-web/Cargo.toml

      - name: Windows portable package smoke
        shell: cmd
        run: PACKAGE_RUST_WEB.bat

      - name: Commit cleanup
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust-web/src/auth.rs rust-web/src/backend.rs rust-web/src/primary_config.rs rust-web/src/security.rs rust-web/src/store.rs rust-web/src/vod_tool_settings.rs
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: clean phase10 dead code"
            git push origin HEAD:phase10-session-auth
          }
