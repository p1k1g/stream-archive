name: Phase 19 Codex review fix

on:
  push:
    branches:
      - codex/perform-phase-19-runtime-hardening
    paths:
      - ".github/scripts/phase19_codex_review_fix.py"
      - ".github/workflows/phase19-codex-review-fix.yml"
  workflow_dispatch:

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/perform-phase-19-runtime-hardening
          fetch-depth: 0

      - name: Apply Codex review fixes
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          python .github/scripts/phase19_codex_review_fix.py
          git add -A
          git diff --cached --check

      - name: Runtime contract guard
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./maintenance/Test-RuntimeContracts.ps1

      - name: Rust format
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: cargo fmt --manifest-path rust-web/Cargo.toml

      - name: Rust unit tests
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: cargo test --locked --manifest-path rust-web/Cargo.toml

      - name: Rust check
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: cargo check --locked --manifest-path rust-web/Cargo.toml

      - name: Commit validated fix
        shell: cmd
        run: |
          git rm .github\scripts\phase19_codex_review_fix.py .github\workflows\phase19-codex-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address Phase 19 Codex ownership review"
          git push origin HEAD:codex/perform-phase-19-runtime-hardening
