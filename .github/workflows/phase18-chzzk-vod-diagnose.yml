name: Phase 18 CHZZK VOD diagnose

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase18-chzzk-vod-diagnose.yml"
      - ".github/scripts/phase18_pipe_diagnose.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase18-chzzk-vod-diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect API duration and Streamlink stdout pipe
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $detail = Invoke-RestMethod -Uri 'https://api.chzzk.naver.com/service/v3/videos/15185683' -Method Get
          Write-Host ("api.duration=" + $detail.content.duration)
          python .github/scripts/phase18_pipe_diagnose.py
          if ($LASTEXITCODE -ne 0) { throw 'pipe diagnose failed' }
