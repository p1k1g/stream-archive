name: Phase 21.6 final wiring

on:
  push:
    branches:
      - phase21-queue-history

permissions:
  contents: write

concurrency:
  group: phase21-6-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[phase21-finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase21-queue-history
          fetch-depth: 0

      - name: Apply stored Queue and History wiring patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/phase21-6-wire.yml').read_text()
          start_marker = '          from pathlib import Path\n'
          end_marker = '\n          PY\n\n      - name: Format Rust'
          start = workflow.index(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          code = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          )

          # YAML block scalars strip their own indentation before the embedded
          # Python runs. The stored patch therefore contains anchors whose leading
          # spaces are 10 columns narrower when re-executed from this workflow.
          # Replace the helper with an indentation-aware fallback so semantic
          # anchors remain strict while harmless whitespace changes do not fail.
          helper_start = code.index('def replace_once(text, old, new, label):')
          helper_end = code.index('\n\n# ---- Slint shell', helper_start)
          helper = r'''def replace_once(text, old, new, label):
    if old in text:
        return text.replace(old, new, 1)

    tokens = [token for token in re.split(r"\s+", old.strip()) if token]
    if not tokens:
        raise SystemExit(f"empty patch anchor: {label}")
    pattern = re.compile(r"\s+".join(re.escape(token) for token in tokens), re.DOTALL)
    match = pattern.search(text)
    if match is None:
        raise SystemExit(f"missing patch anchor: {label}")

    def leading_spaces(line):
        return len(line) - len(line.lstrip(' '))

    old_line = next((line for line in old.splitlines() if line.strip()), '')
    actual_line = next((line for line in match.group(0).splitlines() if line.strip()), '')
    delta = leading_spaces(actual_line) - leading_spaces(old_line)

    if delta:
        shifted = []
        for line in new.splitlines(keepends=True):
            if not line.strip():
                shifted.append(line)
            elif delta > 0:
                shifted.append((' ' * delta) + line)
            else:
                remove = min(-delta, leading_spaces(line))
                shifted.append(line[remove:])
        new = ''.join(shifted)

    return text[:match.start()] + new + text[match.end():]
'''
          code = code[:helper_start] + helper + code[helper_end:]
          code = code.replace('from pathlib import Path\n', 'from pathlib import Path\nimport re\n', 1)
          exec(compile(code, 'phase21-6-wire.py', 'exec'))
          PY

      - name: Format Rust
        run: |
          cargo fmt --manifest-path rust-web/Cargo.toml --all
          cargo fmt --manifest-path rust-gui/Cargo.toml --all

      - name: Check shared core and native GUI
        run: |
          cargo check --locked --manifest-path rust-web/Cargo.toml
          cargo check --locked --manifest-path rust-gui/Cargo.toml

      - name: Test shared core and native adapters
        run: |
          cargo test --locked --manifest-path rust-web/Cargo.toml
          cargo test --locked --manifest-path rust-gui/Cargo.toml

      - name: Remove temporary wiring workflows
        run: |
          git rm -f \
            .github/workflows/phase21-6-wire.yml \
            .github/workflows/phase21-6-wire-runner.yml \
            .github/workflows/phase21-6-wire-runner2.yml \
            .github/workflows/phase21-6-wire-runner3.yml \
            .github/workflows/phase21-6-finalize.yml

      - name: Commit Phase 21.6 wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust-gui rust-web docs .github/workflows || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "[phase21-finalize] Wire native Queue and History"
          git push origin HEAD:phase21-queue-history
