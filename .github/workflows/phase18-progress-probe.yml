name: Phase 18 Streamlink progress probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase18-progress-probe.yml"

concurrency:
  group: phase18-progress-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe FFmpeg progress through Streamlink player verbose
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $streamlink = 'C:\Program Files\Streamlink\bin\streamlink.exe'
          $ffmpeg = 'C:\Program Files\Streamlink\ffmpeg\ffmpeg.exe'
          $out = Join-Path $env:RUNNER_TEMP 'chzzk-progress-probe.ts'
          Remove-Item -LiteralPath $out -Force -ErrorAction SilentlyContinue
          $playerArgs = '-hide_banner -loglevel warning -nostats -progress pipe:2 -fflags +genpts+discardcorrupt -i {playerinput} -map 0:v:0? -map 0:a:0? -c copy -bsf:v h264_mp4toannexb -f mpegts -mpegts_flags resend_headers -mpegts_copyts 0 -avoid_negative_ts make_zero -muxpreload 0 -muxdelay 0 -avioflags direct -y "' + $out + '"'
          $log = & $streamlink --no-config --stream-segmented-duration 8 --ffmpeg-ffmpeg $ffmpeg --player $ffmpeg --player-args $playerArgs --player-verbose 'https://chzzk.naver.com/video/15185683' best 2>&1 | Out-String
          Write-Host $log
          if ($LASTEXITCODE -ne 0) { throw "Streamlink probe failed: $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $out -PathType Leaf)) { throw 'Probe TS output missing' }
          if ($log -notmatch 'out_time_(?:us|ms)=|out_time=') { throw 'FFmpeg progress was not relayed by Streamlink player verbose' }
          Remove-Item -LiteralPath $out -Force -ErrorAction SilentlyContinue
