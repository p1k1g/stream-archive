name: Stream Archive check

on:
  pull_request:
    paths:
      - "rust-runtime/**"
      - "rust-gui/**"
      - "RUN_DEV.bat"
      - "BUILD_PORTABLE.bat"
      - "BUILD_UNIX_PACKAGE.sh"
      - ".gitignore"
      - "maintenance/**"
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "rust-runtime/**"
      - "rust-gui/**"
      - "RUN_DEV.bat"
      - "BUILD_PORTABLE.bat"
      - "BUILD_UNIX_PACKAGE.sh"
      - ".gitignore"
      - "maintenance/**"
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: stream-archive-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-check:
    name: core-check (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies and targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-runtime -> target
            rust-gui -> target
          cache-on-failure: true

      - name: Environment
        shell: bash
        run: |
          echo "platform=${{ matrix.platform }}"
          echo "runner_arch=${{ runner.arch }}"
          rustc --version
          rustc -vV | grep '^host:'
          cargo --version
          cargo clippy --version
          git --version

      - name: Stable release version contract
        shell: bash
        run: |
          python3 - <<'PYVERSION'
          import json, re, subprocess
          versions = {}
          for manifest, name in [('rust-runtime/Cargo.toml', 'stream-archive-server'), ('rust-gui/Cargo.toml', 'stream-archive-gui')]:
              data = json.loads(subprocess.check_output(['cargo', 'metadata', '--locked', '--no-deps', '--format-version', '1', '--manifest-path', manifest]))
              package = next(p for p in data['packages'] if p['name'] == name)
              assert re.fullmatch(r'\d+\.\d+\.\d+', package['version']), (name, package['version'])
              versions[name] = package['version']
          assert versions['stream-archive-server'] == versions['stream-archive-gui'], versions
          PYVERSION

      - name: Rust format check
        shell: bash
        run: cargo fmt --manifest-path rust-runtime/Cargo.toml -- --check

      - name: Rust unit tests
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            # The retained Job Object test launches a real PowerShell child and
            # descendant. Running the Windows test harness serially avoids CI
            # scheduler/AV contention from turning its bounded startup wait into
            # a false negative while preserving the ownership assertion itself.
            cargo test --locked --manifest-path rust-runtime/Cargo.toml -- --test-threads=1
          else
            cargo test --locked --manifest-path rust-runtime/Cargo.toml
          fi

      - name: Unix CLI integration smoke
        if: ${{ matrix.platform != 'windows' }}
        shell: bash
        run: cargo test --locked --manifest-path rust-runtime/Cargo.toml --test unix_cli -- --test-threads=1

      - name: Unix source archive metadata smoke
        if: ${{ matrix.platform != 'windows' }}
        shell: bash
        run: |
          scratch="$RUNNER_TEMP/stream-archive-no-git-unix"
          rm -rf "$scratch"
          mkdir -p "$scratch"
          (
            cd "$scratch"
            "$GITHUB_WORKSPACE/maintenance/Write-ReleaseMetadata.sh" \
              "$scratch/RELEASE_INFO.txt" \
              "$GITHUB_WORKSPACE/rust-runtime/Cargo.toml"
          )
          grep -qx 'commit=unknown' "$scratch/RELEASE_INFO.txt"

          probe="$GITHUB_WORKSPACE/phase23-release-dirty-probe.tmp"
          dirty="$scratch/RELEASE_INFO_DIRTY.txt"
          trap 'rm -f "$probe"' EXIT
          printf 'dirty provenance probe\n' > "$probe"
          (
            cd "$GITHUB_WORKSPACE"
            ./maintenance/Write-ReleaseMetadata.sh \
              "$dirty" \
              "$GITHUB_WORKSPACE/rust-runtime/Cargo.toml"
          )
          grep -Eq '^commit=[0-9a-f]{12}-dirty$' "$dirty"
          rm -f "$probe"
          trap - EXIT

          fake_git_dir="$scratch/fake-git"
          status_failure="$scratch/RELEASE_INFO_STATUS_FAILURE.txt"
          real_git="$(command -v git)"
          mkdir -p "$fake_git_dir"
          cat > "$fake_git_dir/git" <<'EOF'
          #!/usr/bin/env bash
          if [[ "${1:-}" == "status" ]]; then
            exit 42
          fi
          exec "$REAL_GIT" "$@"
          EOF
          chmod +x "$fake_git_dir/git"
          (
            cd "$GITHUB_WORKSPACE"
            REAL_GIT="$real_git" PATH="$fake_git_dir:$PATH"               ./maintenance/Write-ReleaseMetadata.sh               "$status_failure"               "$GITHUB_WORKSPACE/rust-runtime/Cargo.toml"
          )
          grep -qx 'commit=unknown' "$status_failure"

      - name: Native compile check
        shell: bash
        run: cargo check --locked --manifest-path rust-runtime/Cargo.toml

      - name: GPUI shell Rust format check
        if: ${{ always() && matrix.platform == 'windows' }}
        shell: bash
        run: cargo fmt --manifest-path rust-gui/Cargo.toml -- --check

      - name: GPUI shell compile check
        if: ${{ matrix.platform == 'windows' }}
        shell: bash
        run: cargo check --locked --manifest-path rust-gui/Cargo.toml

      - name: Native settings adapter tests
        if: ${{ matrix.platform == 'windows' }}
        shell: bash
        run: cargo test --locked --manifest-path rust-gui/Cargo.toml

      - name: Rust clippy strict
        shell: bash
        run: cargo clippy --locked --manifest-path rust-runtime/Cargo.toml --all-targets --all-features -- -D warnings

      - name: GPUI shell clippy strict
        if: ${{ matrix.platform == 'windows' }}
        shell: bash
        run: cargo clippy --locked --manifest-path rust-gui/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Unix release package smoke
        if: ${{ matrix.platform != 'windows' }}
        shell: bash
        run: ./BUILD_UNIX_PACKAGE.sh

      - name: Verify Unix stable artifact version
        if: ${{ matrix.platform != 'windows' }}
        shell: bash
        run: |
          expected="$(python3 -c "import json, subprocess; d=json.loads(subprocess.check_output(['cargo', 'metadata', '--locked', '--no-deps', '--format-version', '1', '--manifest-path', 'rust-runtime/Cargo.toml'])); print(next(p['version'] for p in d['packages'] if p['name']=='stream-archive-server'))")"
          metadata="$(find dist -type f -path '*/unix-*/stream-archive/RELEASE_INFO.txt' -print -quit)"
          grep -qx "version=$expected" "$metadata"

      - name: Reject corrupted Unix release archive
        if: ${{ matrix.platform != 'windows' }}
        shell: bash
        run: |
          package_root="$(find dist -type d -path '*/unix-*/stream-archive' -print -quit)"
          archive="$(find dist/release -maxdepth 1 -type f -name 'stream-archive-*.tar.gz' -print -quit)"
          [[ -n "$package_root" && -n "$archive" ]] || { echo 'Unix RC artifact not found.' >&2; exit 1; }
          probe="$RUNNER_TEMP/$(basename "$archive")"
          cp "$archive" "$probe"
          cp "$archive.sha256" "$probe.sha256"
          printf '\nphase23.7 checksum corruption probe\n' >> "$probe"
          if ./maintenance/Verify-UnixPackage.sh "$package_root" "$probe"; then
            echo 'Corrupted Unix release archive was accepted.' >&2
            exit 1
          fi

  windows-check:
    name: windows-check
    needs: core-check
    if: ${{ always() }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Enforce cross-platform core results
        shell: bash
        run: |
          if [[ "${{ needs.core-check.result }}" != "success" ]]; then
            echo 'One or more Windows/Linux/macOS core checks failed.' >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-runtime -> target
            rust-gui -> target
          cache-on-failure: true

      - name: Environment
        shell: bash
        run: |
          echo "runner_arch=${{ runner.arch }}"
          rustc --version
          rustc -vV | grep '^host:'
          cargo --version
          git --version

      - name: Runtime contract guard
        shell: bash
        run: cargo test --locked --manifest-path ./rust-runtime/Cargo.toml --test runtime_contracts -- --nocapture

      - name: Windows portable package smoke
        shell: cmd
        run: BUILD_PORTABLE.bat

      - name: Source archive metadata smoke
        shell: bash
        run: |
          set -euo pipefail
          exe="$GITHUB_WORKSPACE/dist/stream-archive/StreamArchive.exe"
          manifest="$GITHUB_WORKSPACE/rust-runtime/Cargo.toml"
          scratch="$RUNNER_TEMP/stream-archive-no-git"
          rm -rf "$scratch"
          mkdir -p "$scratch"
          output="$scratch/RELEASE_INFO.txt"

          (
            cd "$scratch"
            "$exe" --write-release-metadata --output-path "$output" --manifest-path "$manifest"
          )
          if [[ ! -f "$output" ]]; then
            echo 'source-archive metadata file was not created' >&2
            exit 1
          fi
          if ! grep -qx 'commit=unknown' "$output"; then
            echo 'source-archive metadata should use commit=unknown outside a Git checkout' >&2
            exit 1
          fi

          explicit_root_output="$scratch/RELEASE_INFO_EXPLICIT_ROOT.txt"
          "$exe" --write-release-metadata --output-path "$explicit_root_output" --manifest-path "$manifest" --repository-root "$scratch"
          if ! grep -qx 'commit=unknown' "$explicit_root_output"; then
            echo 'explicit non-Git RepositoryRoot must use commit=unknown even when GITHUB_SHA is present' >&2
            exit 1
          fi

          checkout_output="$scratch/RELEASE_INFO_CHECKOUT.txt"
          "$exe" --write-release-metadata --output-path "$checkout_output" --manifest-path "$manifest" --repository-root "$GITHUB_WORKSPACE"
          expected_commit="commit=$(printf '%s' "$GITHUB_SHA" | cut -c1-12 | tr '[:upper:]' '[:lower:]')"
          if ! grep -qx "$expected_commit" "$checkout_output"; then
            echo "checkout metadata must match GITHUB_SHA: expected $expected_commit" >&2
            exit 1
          fi

          workspace_dirty_probe="$GITHUB_WORKSPACE/phase23-workspace-dirty-probe.tmp"
          workspace_dirty_output="$scratch/RELEASE_INFO_WORKSPACE_DIRTY.txt"
          trap 'rm -f "$workspace_dirty_probe"' EXIT
          printf 'dirty GitHub workspace provenance probe\n' > "$workspace_dirty_probe"
          "$exe" --write-release-metadata --output-path "$workspace_dirty_output" --manifest-path "$manifest" --repository-root "$GITHUB_WORKSPACE"
          if ! grep -qx "${expected_commit}-dirty" "$workspace_dirty_output"; then
            echo 'trusted GitHub checkout dirty metadata must include the -dirty provenance marker' >&2
            exit 1
          fi
          rm -f "$workspace_dirty_probe"
          trap - EXIT

          worktree_root="$RUNNER_TEMP/stream-archive-linked-worktree"
          worktree_branch='phase23-ci-linked-worktree'
          worktree_output="$scratch/RELEASE_INFO_WORKTREE.txt"
          worktree_dirty_output="$scratch/RELEASE_INFO_WORKTREE_DIRTY.txt"
          rm -rf "$worktree_root"
          if git show-ref --verify --quiet "refs/heads/$worktree_branch"; then
            git branch -D "$worktree_branch" >/dev/null
          fi
          cleanup_worktree() {
            if [[ -d "$worktree_root" ]]; then
              git worktree remove --force "$worktree_root" >/dev/null 2>&1 || true
            fi
            if git show-ref --verify --quiet "refs/heads/$worktree_branch"; then
              git branch -D "$worktree_branch" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_worktree EXIT
          git worktree add -b "$worktree_branch" "$worktree_root" HEAD
          "$exe" --write-release-metadata --output-path "$worktree_output" --manifest-path "$manifest" --repository-root "$worktree_root"
          expected_worktree_commit="commit=$(git -C "$worktree_root" rev-parse --short=12 HEAD | tr -d '\r' | tr '[:upper:]' '[:lower:]')"
          if ! grep -qx "$expected_worktree_commit" "$worktree_output"; then
            echo "linked worktree metadata must resolve commondir refs: expected $expected_worktree_commit" >&2
            exit 1
          fi
          printf 'dirty linked worktree provenance probe\n' > "$worktree_root/phase23-worktree-dirty-probe.tmp"
          "$exe" --write-release-metadata --output-path "$worktree_dirty_output" --manifest-path "$manifest" --repository-root "$worktree_root"
          if ! grep -qx "${expected_worktree_commit}-dirty" "$worktree_dirty_output"; then
            echo 'linked worktree dirty metadata must include the -dirty provenance marker' >&2
            exit 1
          fi

      - name: Verify Windows portable package
        shell: bash
        run: |
          set -euo pipefail
          ./dist/stream-archive/StreamArchive.exe --verify-windows-package --root ./dist/stream-archive --require-clean-data
          expected="$(python3 -c "import json, subprocess; d=json.loads(subprocess.check_output(['cargo', 'metadata', '--locked', '--no-deps', '--format-version', '1', '--manifest-path', 'rust-runtime/Cargo.toml'])); print(next(p['version'] for p in d['packages'] if p['name']=='stream-archive-server'))")"
          actual="$(./dist/stream-archive/StreamArchive.exe --version | tr -d '\r')"
          [[ "$actual" == "Stream Archive $expected" ]] || { echo "Unexpected --version output: $actual (expected Stream Archive $expected)" >&2; exit 1; }

      - name: Windows offline backup restore smoke
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/Stream Archive RC backup 테스트"
          data="$scratch/data 한글"
          backups="$scratch/backups 한글"
          package_safety="./dist/stream-archive-backups"
          cleanup() {
            rm -rf "$scratch" "$package_safety"
          }
          trap cleanup EXIT
          cleanup
          mkdir -p "$data" "$backups"
          db="$data/stream-archive.db"
          python3 - "$db" <<'PYDB'
          import sys
          buf = bytearray(4096)
          buf[:16] = b'SQLite format 3\x00'
          with open(sys.argv[1], 'wb') as f:
              f.write(buf)
          PYDB

          ./dist/stream-archive/StreamArchive.exe --backup --data-dir "$data" --backup-dir "$backups" --keep 5 --retention-days 30
          backup="$(find "$backups" -maxdepth 1 -type f -name 'stream_archive_*.db' -print -quit)"
          if [[ -z "$backup" || ! -f "$backup.json" ]]; then
            echo 'Windows RC backup smoke did not create backup metadata.' >&2
            exit 1
          fi
          backup_hash="$(python3 -c "import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest())" "$backup")"

          python3 - "$db" <<'PYMUT'
          import sys
          with open(sys.argv[1], 'r+b') as f:
              f.seek(32)
              f.write(b'\x01')
          PYMUT
          ./dist/stream-archive/StreamArchive.exe --restore --backup-file "$backup" --data-dir "$data"
          restored_hash="$(python3 -c "import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest())" "$db")"
          if [[ "$restored_hash" != "$backup_hash" ]]; then
            echo 'Windows RC restore did not restore the backed-up database bytes.' >&2
            exit 1
          fi

          printf 'corruption' >> "$backup"
          if ./dist/stream-archive/StreamArchive.exe --restore --backup-file "$backup" --data-dir "$data"; then
            echo 'Windows restore accepted a backup whose SHA256 no longer matched metadata.' >&2
            exit 1
          fi

      - name: Reject runtime data from Windows release archives
        shell: bash
        run: |
          set -euo pipefail
          probe='./dist/stream-archive/data/release-leak-probe.db'
          cleanup() {
            rm -f "$probe"
            rm -rf './dist/reject-probe'
          }
          trap cleanup EXIT
          printf 'runtime state must never be archived\n' > "$probe"
          if ./dist/stream-archive/StreamArchive.exe --new-windows-release-archive --package-root './dist/stream-archive' --output-dir './dist/reject-probe'; then
            echo 'Windows release archiver accepted non-empty runtime data.' >&2
            exit 1
          fi

      - name: Build Windows release archive
        shell: bash
        run: ./dist/stream-archive/StreamArchive.exe --new-windows-release-archive --package-root './dist/stream-archive' --output-dir './dist/release'

      - name: Reject corrupted Windows release archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find ./dist/release -maxdepth 1 -type f -name 'stream-archive-windows-*.zip' -print -quit)"
          [[ -n "$archive" ]] || { echo 'Windows release archive was not created.' >&2; exit 1; }
          probe="$RUNNER_TEMP/$(basename "$archive")"
          probe_checksum="$probe.sha256"
          trap 'rm -f "$probe" "$probe_checksum"' EXIT
          cp "$archive" "$probe"
          cp "$archive.sha256" "$probe_checksum"
          printf 'phase23.7 checksum corruption probe' >> "$probe"
          if ./dist/stream-archive/StreamArchive.exe --verify-windows-package --root './dist/stream-archive' --require-clean-data --archive-path "$probe" --archive-checksum-path "$probe_checksum"; then
            echo 'Corrupted Windows release archive was accepted.' >&2
            exit 1
          fi

      - name: Verify Windows release archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find ./dist/release -maxdepth 1 -type f -name 'stream-archive-windows-*.zip' -print -quit)"
          [[ -n "$archive" ]] || { echo 'Windows release archive was not created.' >&2; exit 1; }
          ./dist/stream-archive/StreamArchive.exe --verify-windows-package --root './dist/stream-archive' --require-clean-data --archive-path "$archive" --archive-checksum-path "$archive.sha256"
