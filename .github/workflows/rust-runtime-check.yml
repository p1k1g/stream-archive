name: Stream Archive check

on:
  pull_request:
    paths:
      - "rust-runtime/**"
      - "rust-gui/**"
      - "RUN_DEV.bat"
      - "BUILD_PORTABLE.bat"
      - "BUILD_UNIX_PACKAGE.sh"
      - ".gitignore"
      - "maintenance/**"
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "rust-runtime/**"
      - "rust-gui/**"
      - "RUN_DEV.bat"
      - "BUILD_PORTABLE.bat"
      - "BUILD_UNIX_PACKAGE.sh"
      - ".gitignore"
      - "maintenance/**"
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: stream-archive-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-check:
    name: core-check (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies and targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-runtime -> target
            rust-gui -> target
          cache-on-failure: true

      - name: Environment
        shell: bash
        run: |
          echo "platform=${{ matrix.platform }}"
          echo "runner_arch=${{ runner.arch }}"
          rustc --version
          rustc -vV | grep '^host:'
          cargo --version
          cargo clippy --version
          git --version

      - name: Rust format check
        shell: bash
        run: cargo fmt --manifest-path rust-runtime/Cargo.toml -- --check

      - name: Rust unit tests
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            # The retained Job Object test launches a real PowerShell child and
            # descendant. Running the Windows test harness serially avoids CI
            # scheduler/AV contention from turning its bounded startup wait into
            # a false negative while preserving the ownership assertion itself.
            cargo test --locked --manifest-path rust-runtime/Cargo.toml -- --test-threads=1
          else
            cargo test --locked --manifest-path rust-runtime/Cargo.toml
          fi

      - name: Unix CLI integration smoke
        if: ${{ matrix.platform != 'windows' }}
        shell: bash
        run: cargo test --locked --manifest-path rust-runtime/Cargo.toml --test unix_cli -- --test-threads=1

      - name: Unix source archive metadata smoke
        if: ${{ matrix.platform != 'windows' }}
        shell: bash
        run: |
          scratch="$RUNNER_TEMP/stream-archive-no-git-unix"
          rm -rf "$scratch"
          mkdir -p "$scratch"
          (
            cd "$scratch"
            "$GITHUB_WORKSPACE/maintenance/Write-ReleaseMetadata.sh" \
              "$scratch/RELEASE_INFO.txt" \
              "$GITHUB_WORKSPACE/rust-runtime/Cargo.toml"
          )
          grep -qx 'commit=unknown' "$scratch/RELEASE_INFO.txt"

          probe="$GITHUB_WORKSPACE/phase23-release-dirty-probe.tmp"
          dirty="$scratch/RELEASE_INFO_DIRTY.txt"
          trap 'rm -f "$probe"' EXIT
          printf 'dirty provenance probe\n' > "$probe"
          (
            cd "$GITHUB_WORKSPACE"
            ./maintenance/Write-ReleaseMetadata.sh \
              "$dirty" \
              "$GITHUB_WORKSPACE/rust-runtime/Cargo.toml"
          )
          grep -Eq '^commit=[0-9a-f]{12}-dirty$' "$dirty"
          rm -f "$probe"
          trap - EXIT

      - name: Native compile check
        shell: bash
        run: cargo check --locked --manifest-path rust-runtime/Cargo.toml

      - name: Slint shell Rust format check
        if: ${{ always() && matrix.platform == 'windows' }}
        shell: bash
        run: cargo fmt --manifest-path rust-gui/Cargo.toml -- --check

      - name: Slint shell compile check
        if: ${{ matrix.platform == 'windows' }}
        shell: bash
        run: cargo check --locked --manifest-path rust-gui/Cargo.toml

      - name: Native settings adapter tests
        if: ${{ matrix.platform == 'windows' }}
        shell: bash
        run: cargo test --locked --manifest-path rust-gui/Cargo.toml

      - name: Rust clippy strict
        shell: bash
        run: cargo clippy --locked --manifest-path rust-runtime/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Slint shell clippy strict
        if: ${{ matrix.platform == 'windows' }}
        shell: bash
        run: cargo clippy --locked --manifest-path rust-gui/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Unix release package smoke
        if: ${{ matrix.platform != 'windows' }}
        shell: bash
        run: ./BUILD_UNIX_PACKAGE.sh

  windows-check:
    name: windows-check
    needs: core-check
    if: ${{ always() }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Enforce cross-platform core results
        shell: powershell
        run: |
          if ('${{ needs.core-check.result }}' -ne 'success') {
            throw 'One or more Windows/Linux/macOS core checks failed.'
          }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-runtime -> target
            rust-gui -> target
          cache-on-failure: true

      - name: Environment
        shell: powershell
        run: |
          Write-Host "runner_arch=${{ runner.arch }}"
          rustc --version
          rustc -vV | Select-String '^host:'
          cargo --version
          git --version

      - name: Runtime contract guard
        shell: powershell
        run: ./maintenance/Test-RuntimeContracts.ps1

      - name: Source archive metadata smoke
        shell: powershell
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP 'stream-archive-no-git'
          if (Test-Path -LiteralPath $scratch) {
            Remove-Item -LiteralPath $scratch -Recurse -Force
          }
          New-Item -ItemType Directory -Path $scratch | Out-Null
          $output = Join-Path $scratch 'RELEASE_INFO.txt'

          Push-Location $scratch
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\maintenance\Write-ReleaseMetadata.ps1" -OutputPath $output -ManifestPath "$env:GITHUB_WORKSPACE\rust-runtime\Cargo.toml"
            if ($LASTEXITCODE -ne 0) {
              throw "Write-ReleaseMetadata.ps1 child process failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) {
            throw 'source-archive metadata file was not created'
          }
          $commitLine = Get-Content -LiteralPath $output |
            Where-Object { $_.TrimStart([char]0xFEFF).Trim().StartsWith('commit=') } |
            Select-Object -First 1
          if ($null -eq $commitLine -or $commitLine.TrimStart([char]0xFEFF).Trim() -ne 'commit=unknown') {
            throw 'source-archive metadata should use commit=unknown outside a Git checkout'
          }

          $explicitRootOutput = Join-Path $scratch 'RELEASE_INFO_EXPLICIT_ROOT.txt'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\maintenance\Write-ReleaseMetadata.ps1" -OutputPath $explicitRootOutput -ManifestPath "$env:GITHUB_WORKSPACE\rust-runtime\Cargo.toml" -RepositoryRoot $scratch
          if ($LASTEXITCODE -ne 0) {
            throw "explicit non-Git RepositoryRoot probe failed with exit code $LASTEXITCODE"
          }
          $explicitRootCommit = Get-Content -LiteralPath $explicitRootOutput |
            Where-Object { $_.TrimStart([char]0xFEFF).Trim().StartsWith('commit=') } |
            Select-Object -First 1
          if ($null -eq $explicitRootCommit -or $explicitRootCommit.TrimStart([char]0xFEFF).Trim() -ne 'commit=unknown') {
            throw 'explicit non-Git RepositoryRoot must use commit=unknown even when GITHUB_SHA is present'
          }

          $checkoutOutput = Join-Path $scratch 'RELEASE_INFO_CHECKOUT.txt'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\maintenance\Write-ReleaseMetadata.ps1" -OutputPath $checkoutOutput -ManifestPath "$env:GITHUB_WORKSPACE\rust-runtime\Cargo.toml" -RepositoryRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) {
            throw "checkout release metadata probe failed with exit code $LASTEXITCODE"
          }
          $checkoutCommit = Get-Content -LiteralPath $checkoutOutput |
            Where-Object { $_.TrimStart([char]0xFEFF).Trim().StartsWith('commit=') } |
            Select-Object -First 1
          $expectedCommit = 'commit=' + $env:GITHUB_SHA.Substring(0, 12).ToLowerInvariant()
          if ($null -eq $checkoutCommit -or $checkoutCommit.TrimStart([char]0xFEFF).Trim() -ne $expectedCommit) {
            throw "checkout metadata must match GITHUB_SHA: expected $expectedCommit"
          }

          $worktreeRoot = Join-Path $env:RUNNER_TEMP 'stream-archive-linked-worktree'
          $worktreeBranch = 'phase23-ci-linked-worktree'
          $worktreeOutput = Join-Path $scratch 'RELEASE_INFO_WORKTREE.txt'
          $worktreeDirtyOutput = Join-Path $scratch 'RELEASE_INFO_WORKTREE_DIRTY.txt'
          if (Test-Path -LiteralPath $worktreeRoot) {
            Remove-Item -LiteralPath $worktreeRoot -Recurse -Force
          }
          git branch -D $worktreeBranch 2>$null
          try {
            git worktree add -b $worktreeBranch $worktreeRoot HEAD
            if ($LASTEXITCODE -ne 0) {
              throw "linked worktree creation failed with exit code $LASTEXITCODE"
            }

            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\maintenance\Write-ReleaseMetadata.ps1" -OutputPath $worktreeOutput -ManifestPath "$env:GITHUB_WORKSPACE\rust-runtime\Cargo.toml" -RepositoryRoot $worktreeRoot
            if ($LASTEXITCODE -ne 0) {
              throw "linked worktree release metadata probe failed with exit code $LASTEXITCODE"
            }
            $worktreeCommit = Get-Content -LiteralPath $worktreeOutput |
              Where-Object { $_.TrimStart([char]0xFEFF).Trim().StartsWith('commit=') } |
              Select-Object -First 1
            $expectedWorktreeCommit = 'commit=' + ((git -C $worktreeRoot rev-parse --short=12 HEAD).Trim().ToLowerInvariant())
            if ($null -eq $worktreeCommit -or $worktreeCommit.TrimStart([char]0xFEFF).Trim() -ne $expectedWorktreeCommit) {
              throw "linked worktree metadata must resolve commondir refs: expected $expectedWorktreeCommit"
            }

            Set-Content -LiteralPath (Join-Path $worktreeRoot 'phase23-worktree-dirty-probe.tmp') -Value 'dirty linked worktree provenance probe' -Encoding ASCII
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\maintenance\Write-ReleaseMetadata.ps1" -OutputPath $worktreeDirtyOutput -ManifestPath "$env:GITHUB_WORKSPACE\rust-runtime\Cargo.toml" -RepositoryRoot $worktreeRoot
            if ($LASTEXITCODE -ne 0) {
              throw "dirty linked worktree release metadata probe failed with exit code $LASTEXITCODE"
            }
            $worktreeDirtyCommit = Get-Content -LiteralPath $worktreeDirtyOutput |
              Where-Object { $_.TrimStart([char]0xFEFF).Trim().StartsWith('commit=') } |
              Select-Object -First 1
            if ($null -eq $worktreeDirtyCommit -or $worktreeDirtyCommit.TrimStart([char]0xFEFF).Trim() -ne ($expectedWorktreeCommit + '-dirty')) {
              throw "linked worktree dirty metadata must include the -dirty provenance marker"
            }
          }
          finally {
            git worktree remove --force $worktreeRoot 2>$null
            git branch -D $worktreeBranch 2>$null
          }

      - name: Windows portable package smoke
        shell: cmd
        run: BUILD_PORTABLE.bat

      - name: Verify Windows portable package
        shell: powershell
        run: ./maintenance/Verify-WindowsPackage.ps1 -Root './dist/stream-archive' -RequireCleanData

      - name: Reject runtime data from Windows release archives
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = './dist/stream-archive/data/release-leak-probe.db'
          $rejected = $false
          try {
            Set-Content -LiteralPath $probe -Value 'runtime state must never be archived' -Encoding ASCII
            try {
              ./maintenance/New-WindowsReleaseArchive.ps1 -PackageRoot './dist/stream-archive' -OutputDir './dist/reject-probe'
            }
            catch {
              $rejected = $true
            }
          }
          finally {
            Remove-Item -LiteralPath $probe -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath './dist/reject-probe' -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (-not $rejected) {
            throw 'Windows release archiver accepted non-empty runtime data.'
          }

      - name: Build Windows release archive
        shell: powershell
        run: ./maintenance/New-WindowsReleaseArchive.ps1 -PackageRoot './dist/stream-archive' -OutputDir './dist/release'

      - name: Verify Windows release archive
        shell: powershell
        run: |
          $archive = Get-ChildItem -LiteralPath './dist/release' -Filter 'stream-archive-windows-*.zip' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $archive) { throw 'Windows release archive was not created.' }
          ./maintenance/Verify-WindowsPackage.ps1 -Root './dist/stream-archive' -RequireCleanData -ArchivePath $archive.FullName -ArchiveChecksumPath "$($archive.FullName).sha256"
