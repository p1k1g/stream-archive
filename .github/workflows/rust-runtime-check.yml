name: Stream Archive check

on:
  pull_request:
    paths:
      - "rust-runtime/**"
      - "rust-gui/**"
      - "RUN_DEV.bat"
      - "BUILD_PORTABLE.bat"
      - "maintenance/**"
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "rust-runtime/**"
      - "rust-gui/**"
      - "RUN_DEV.bat"
      - "BUILD_PORTABLE.bat"
      - "maintenance/**"
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: stream-archive-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-check:
    name: core-check (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies and targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-runtime -> target
            rust-gui -> target
          cache-on-failure: true

      - name: Environment
        shell: bash
        run: |
          echo "platform=${{ matrix.platform }}"
          rustc --version
          cargo --version
          cargo clippy --version
          git --version


      - name: Rust format check
        shell: bash
        run: cargo fmt --manifest-path rust-runtime/Cargo.toml -- --check

      - name: Rust unit tests
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            # The retained Job Object test launches a real PowerShell child and
            # descendant. Running the Windows test harness serially avoids CI
            # scheduler/AV contention from turning its bounded startup wait into
            # a false negative while preserving the ownership assertion itself.
            cargo test --locked --manifest-path rust-runtime/Cargo.toml -- --test-threads=1
          else
            cargo test --locked --manifest-path rust-runtime/Cargo.toml
          fi

      - name: Native compile check
        shell: bash
        run: cargo check --locked --manifest-path rust-runtime/Cargo.toml

      - name: Slint shell Rust format check
        if: ${{ always() && matrix.platform == 'windows' }}
        shell: bash
        run: cargo fmt --manifest-path rust-gui/Cargo.toml -- --check

      - name: Slint shell compile check
        if: ${{ matrix.platform == 'windows' }}
        shell: bash
        run: cargo check --locked --manifest-path rust-gui/Cargo.toml

      - name: Native settings adapter tests
        if: ${{ matrix.platform == 'windows' }}
        shell: bash
        run: cargo test --locked --manifest-path rust-gui/Cargo.toml

      # Phase 22.2 treats project Clippy warnings as CI failures.
      - name: Rust clippy strict
        shell: bash
        run: cargo clippy --locked --manifest-path rust-runtime/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Slint shell clippy strict
        if: ${{ matrix.platform == 'windows' }}
        shell: bash
        run: cargo clippy --locked --manifest-path rust-gui/Cargo.toml --all-targets --all-features -- -D warnings

  windows-check:
    name: windows-check
    needs: core-check
    if: ${{ always() }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Enforce cross-platform core results
        shell: powershell
        run: |
          if ('${{ needs.core-check.result }}' -ne 'success') {
            throw 'One or more Windows/Linux/macOS core checks failed.'
          }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-runtime -> target
            rust-gui -> target
          cache-on-failure: true

      - name: Environment
        shell: powershell
        run: |
          rustc --version
          cargo --version
          git --version

      - name: Runtime contract guard
        shell: powershell
        run: ./maintenance/Test-RuntimeContracts.ps1

      - name: Source archive metadata smoke
        shell: powershell
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP 'stream-archive-no-git'
          if (Test-Path -LiteralPath $scratch) {
            Remove-Item -LiteralPath $scratch -Recurse -Force
          }
          New-Item -ItemType Directory -Path $scratch | Out-Null
          $output = Join-Path $scratch 'RELEASE_INFO.txt'

          Push-Location $scratch
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File `
              "$env:GITHUB_WORKSPACE\maintenance\Write-ReleaseMetadata.ps1" `
              -OutputPath $output `
              -ManifestPath "$env:GITHUB_WORKSPACE\rust-runtime\Cargo.toml"
            if ($LASTEXITCODE -ne 0) {
              throw "Write-ReleaseMetadata.ps1 child process failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) {
            throw 'source-archive metadata file was not created'
          }
          $commitLine = Get-Content -LiteralPath $output |
            Where-Object { $_.TrimStart([char]0xFEFF).Trim().StartsWith('commit=') } |
            Select-Object -First 1
          if ($null -eq $commitLine -or $commitLine.TrimStart([char]0xFEFF).Trim() -ne 'commit=unknown') {
            throw 'source-archive metadata should use commit=unknown outside a Git checkout'
          }

      - name: Windows portable package smoke
        shell: cmd
        run: BUILD_PORTABLE.bat

      - name: Verify portable package
        shell: powershell
        run: |
          $root = './dist/stream-archive'
          $required = @(
            "$root/StreamArchive.exe",
            "$root/stream-archive-server.exe",
            "$root/RUN.bat",
            "$root/RUN_HEADLESS.bat",
            "$root/BACKUP_DATA.bat",
            "$root/RESTORE_DATA.bat",
            "$root/LICENSE",
            "$root/THIRD_PARTY_NOTICES.md",
            "$root/RELEASE_INFO.txt",
            "$root/SHA256SUMS.txt",
            "$root/maintenance/Backup-StreamArchiveData.ps1",
            "$root/maintenance/Restore-StreamArchiveData.ps1",
            "$root/docs/OPERATIONS.md"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing package file: $path" }
          }
          foreach ($forbidden in @(
            "$root/stream-archive-launcher.exe",
            "$root/RUN_WEB.bat",
            "$root/RUN_SERVER_CONSOLE.bat",
            "$root/Caddyfile.example",
            "$root/docs/REVERSE_PROXY.md",
            "$root/docs/LOCAL_LAUNCHER.md"
          )) {
            if (Test-Path -LiteralPath $forbidden) { throw "Retired Web package file returned: $forbidden" }
          }
          foreach ($dir in @("$root/backend", "$root/data")) {
            if (-not (Test-Path -LiteralPath $dir -PathType Container)) { throw "Missing package directory: $dir" }
          }

          $expected = @{}
          foreach ($line in Get-Content "$root/SHA256SUMS.txt") {
            if ($line -match '^([0-9a-fA-F]{64})\s+(.+)$') {
              $expected[$matches[2].Trim()] = $matches[1].ToLowerInvariant()
            }
          }
          foreach ($name in @('StreamArchive.exe', 'stream-archive-server.exe')) {
            if (-not $expected.ContainsKey($name)) { throw "checksum missing: $name" }
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $root $name)).Hash.ToLowerInvariant()
            if ($expected[$name] -ne $actual) { throw "$name checksum mismatch" }
          }

          $run = Get-Content "$root/RUN.bat" -Raw
          if ($run -notmatch 'StreamArchive\.exe') { throw 'RUN.bat does not use StreamArchive.exe' }
          if ($run -match 'launcher|RUN_WEB|127\.0\.0\.1|http') { throw 'RUN.bat must remain native-only' }

          $headless = Get-Content "$root/RUN_HEADLESS.bat" -Raw
          if ($headless -notmatch 'stream-archive-server\.exe') { throw 'RUN_HEADLESS.bat does not use the headless runtime' }

          $releaseInfo = Get-Content "$root/RELEASE_INFO.txt" -Raw
          if ($releaseInfo -notmatch 'version=') { throw 'release metadata version missing' }
