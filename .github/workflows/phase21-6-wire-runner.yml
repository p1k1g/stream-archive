name: Phase 21.6 wiring runner

on:
  push:
    branches:
      - phase21-queue-history

permissions:
  contents: write

concurrency:
  group: phase21-6-wiring-runner
  cancel-in-progress: true

jobs:
  wire:
    if: "${{ !contains(github.event.head_commit.message, '[phase21-wire]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase21-queue-history
          fetch-depth: 0

      - name: Execute robust Phase 21.6 wiring patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/phase21-6-wire.yml').read_text()
          start_marker = '          from pathlib import Path\n'
          end_marker = '\n          PY\n\n      - name: Format Rust'
          start = workflow.index(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          code = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          )

          helper_start = code.index('def replace_once(text, old, new, label):')
          helper_end = code.index('\n\n# ---- Slint shell', helper_start)
          helper = r'''def replace_once(text, old, new, label):
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f"ambiguous patch anchor: {label}")
                  return text.replace(old, new, 1)

              tokens = [token for token in re.split(r"\s+", old.strip()) if token]
              if not tokens:
                  raise SystemExit(f"empty patch anchor: {label}")
              pattern = re.compile(r"\s+".join(re.escape(token) for token in tokens), re.DOTALL)
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  if not matches:
                      raise SystemExit(f"missing patch anchor: {label}")
                  raise SystemExit(f"ambiguous whitespace-normalized patch anchor: {label} ({len(matches)} matches)")

              match = matches[0]
              line_start = text.rfind("\n", 0, match.start()) + 1
              leading = text[line_start:match.start()]
              if leading.strip():
                  replace_start = match.start()
                  indent = ""
              else:
                  replace_start = line_start
                  indent = leading

              replacement = textwrap.dedent(new)
              if indent:
                  replacement = textwrap.indent(replacement, indent)
              return text[:replace_start] + replacement + text[match.end():]
          '''
          code = code[:helper_start] + helper + code[helper_end:]
          code = code.replace(
              'from pathlib import Path\n',
              'from pathlib import Path\nimport re\nimport textwrap\n',
              1,
          )
          exec(compile(code, 'phase21-6-wire.py', 'exec'))
          PY

      - name: Format native Rust
        shell: bash
        run: cargo fmt --manifest-path rust-gui/Cargo.toml

      - name: Check native GUI
        shell: bash
        run: cargo check --locked --manifest-path rust-gui/Cargo.toml

      - name: Test native adapters
        shell: bash
        run: cargo test --locked --manifest-path rust-gui/Cargo.toml

      - name: Test shared core
        shell: bash
        run: cargo test --locked --manifest-path rust-web/Cargo.toml

      - name: Remove temporary Phase 21.6 wiring workflows
        shell: bash
        run: |
          rm -f .github/workflows/phase21-6-wire.yml
          rm -f .github/workflows/phase21-6-wire-runner.yml
          rm -f .github/workflows/phase21-6-wire-runner2.yml
          rm -f .github/workflows/phase21-6-wire-runner3.yml
          rm -f .github/workflows/phase21-6-finalize.yml
          rm -f .phase21-6-finalize-trigger

      - name: Commit final Phase 21.6 wiring
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No wiring changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[phase21-wire] Wire native Queue and History"
          git push origin HEAD:phase21-queue-history
