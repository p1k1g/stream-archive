name: Stream Archive release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-contracts:
    name: release-contracts
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-runtime -> target
          cache-on-failure: true

      - name: Stable release version contract
        shell: bash
        run: |
          python3 - <<'PYVERSION'
          import json, re, subprocess
          versions = {}
          for manifest, name in [('rust-runtime/Cargo.toml', 'stream-archive-server'), ('rust-gui/Cargo.toml', 'stream-archive-gui')]:
              data = json.loads(subprocess.check_output(['cargo', 'metadata', '--locked', '--no-deps', '--format-version', '1', '--manifest-path', manifest]))
              package = next(p for p in data['packages'] if p['name'] == name)
              assert re.fullmatch(r'\d+\.\d+\.\d+', package['version']), (name, package['version'])
              versions[name] = package['version']
          assert versions['stream-archive-server'] == versions['stream-archive-gui'], versions
          PYVERSION

      - name: Validate release/runtime contracts
        shell: bash
        run: cargo test --locked --manifest-path ./rust-runtime/Cargo.toml --test runtime_contracts -- --nocapture

  windows-package:
    name: windows-package
    needs: release-contracts
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-runtime -> target
            rust-gui -> target
          cache-on-failure: true

      - name: Environment
        shell: bash
        run: |
          echo "runner_os=${{ runner.os }}"
          echo "runner_arch=${{ runner.arch }}"
          rustc --version
          rustc -vV | grep '^host:'
          cargo --version
          git --version

      - name: Shared runtime unit tests
        shell: bash
        run: cargo test --locked --manifest-path ./rust-runtime/Cargo.toml -- --test-threads=1

      - name: Native GUI unit tests
        shell: bash
        run: cargo test --locked --manifest-path ./rust-gui/Cargo.toml

      - name: Build Windows portable package
        shell: cmd
        run: BUILD_PORTABLE.bat

      - name: Verify Windows portable package
        shell: bash
        run: |
          set -euo pipefail
          ./dist/stream-archive/StreamArchive.exe --verify-windows-package --root ./dist/stream-archive --require-clean-data
          expected="$(python3 -c "import json, subprocess; d=json.loads(subprocess.check_output(['cargo', 'metadata', '--locked', '--no-deps', '--format-version', '1', '--manifest-path', 'rust-runtime/Cargo.toml'])); print(next(p['version'] for p in d['packages'] if p['name']=='stream-archive-server'))")"
          actual="$(./dist/stream-archive/StreamArchive.exe --version | tr -d '\r')"
          [[ "$actual" == "Stream Archive $expected" ]] || { echo "Unexpected --version output: $actual (expected Stream Archive $expected)" >&2; exit 1; }

      - name: Build Windows release archive
        shell: bash
        run: ./dist/stream-archive/StreamArchive.exe --new-windows-release-archive --package-root './dist/stream-archive' --output-dir './dist/release'

      - name: Verify Windows release archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find ./dist/release -maxdepth 1 -type f -name 'stream-archive-windows-*.zip' -print -quit)"
          [[ -n "$archive" ]] || { echo 'Windows release archive was not created.' >&2; exit 1; }
          ./dist/stream-archive/StreamArchive.exe --verify-windows-package --root './dist/stream-archive' --require-clean-data --archive-path "$archive" --archive-checksum-path "$archive.sha256"
          artifact="$(basename "$archive" .zip)"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            dist/release/*.zip
            dist/release/*.zip.sha256
          retention-days: 7

  unix-package:
    name: unix-package (${{ matrix.platform }})
    needs: release-contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-runtime -> target
          cache-on-failure: true

      - name: Environment
        shell: bash
        run: |
          echo "runner_os=${{ runner.os }}"
          echo "runner_arch=${{ runner.arch }}"
          rustc --version
          rustc -vV | grep '^host:'
          cargo --version
          git --version

      - name: Shared runtime unit tests
        shell: bash
        run: cargo test --locked --manifest-path ./rust-runtime/Cargo.toml

      - name: Unix CLI integration smoke
        shell: bash
        run: cargo test --locked --manifest-path ./rust-runtime/Cargo.toml --test unix_cli -- --test-threads=1

      - name: Build and verify Unix release package
        shell: bash
        run: ./BUILD_UNIX_PACKAGE.sh

      - name: Verify Unix stable artifact version
        shell: bash
        run: |
          expected="$(python3 -c "import json, subprocess; d=json.loads(subprocess.check_output(['cargo', 'metadata', '--locked', '--no-deps', '--format-version', '1', '--manifest-path', 'rust-runtime/Cargo.toml'])); print(next(p['version'] for p in d['packages'] if p['name']=='stream-archive-server'))")"
          metadata="$(find dist -type f -path '*/unix-*/stream-archive/RELEASE_INFO.txt' -print -quit)"
          grep -qx "version=$expected" "$metadata"

      - name: Resolve release artifact
        id: package
        shell: bash
        run: |
          archive="$(find dist/release -maxdepth 1 -type f -name 'stream-archive-*.tar.gz' -print -quit)"
          [[ -n "$archive" ]] || { echo 'Unix release archive was not created.' >&2; exit 1; }
          artifact="$(basename "$archive" .tar.gz)"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            dist/release/*.tar.gz
            dist/release/*.tar.gz.sha256
          retention-days: 7
