name: Stream Archive release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-contracts:
    name: release-contracts
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Stable release version contract
        shell: bash
        run: |
          python3 - <<'PYVERSION'
          import json, subprocess
          for manifest, name in [('rust-runtime/Cargo.toml', 'stream-archive-server'), ('rust-gui/Cargo.toml', 'stream-archive-gui')]:
              data = json.loads(subprocess.check_output(['cargo', 'metadata', '--locked', '--no-deps', '--format-version', '1', '--manifest-path', manifest]))
              package = next(p for p in data['packages'] if p['name'] == name)
              assert package['version'] == '1.0.0', (name, package['version'])
          PYVERSION

      - name: Validate release/runtime contracts
        shell: powershell
        run: ./maintenance/Test-RuntimeContracts.ps1

  windows-package:
    name: windows-package
    needs: release-contracts
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-runtime -> target
            rust-gui -> target
          cache-on-failure: true

      - name: Environment
        shell: powershell
        run: |
          Write-Host "runner_os=${{ runner.os }}"
          Write-Host "runner_arch=${{ runner.arch }}"
          rustc --version
          rustc -vV | Select-String '^host:'
          cargo --version
          git --version

      - name: Shared runtime unit tests
        shell: powershell
        run: cargo test --locked --manifest-path ./rust-runtime/Cargo.toml -- --test-threads=1

      - name: Native GUI unit tests
        shell: powershell
        run: cargo test --locked --manifest-path ./rust-gui/Cargo.toml

      - name: Build Windows portable package
        shell: cmd
        run: BUILD_PORTABLE.bat

      - name: Verify Windows portable package
        shell: powershell
        run: ./maintenance/Verify-WindowsPackage.ps1 -Root './dist/stream-archive' -RequireCleanData

      - name: Verify Windows stable artifact version
        shell: powershell
        run: |
          $metadata = Get-Content -LiteralPath './dist/stream-archive/RELEASE_INFO.txt'
          if ($metadata -notcontains 'version=1.0.0') { throw 'Expected stable artifact version=1.0.0' }
          $version = (Get-Item './dist/stream-archive/StreamArchive.exe').VersionInfo.ProductVersion
          if ($version -ne '1.0.0') { throw "Expected executable ProductVersion=1.0.0, got $version" }

      - name: Build Windows release archive
        shell: powershell
        run: ./maintenance/New-WindowsReleaseArchive.ps1 -PackageRoot './dist/stream-archive' -OutputDir './dist/release'

      - name: Verify Windows release archive
        id: package
        shell: powershell
        run: |
          $archive = Get-ChildItem -LiteralPath './dist/release' -Filter 'stream-archive-windows-*.zip' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $archive) { throw 'Windows release archive was not created.' }
          ./maintenance/Verify-WindowsPackage.ps1 -Root './dist/stream-archive' -RequireCleanData -ArchivePath $archive.FullName -ArchiveChecksumPath "$($archive.FullName).sha256"
          $artifact = [System.IO.Path]::GetFileNameWithoutExtension($archive.Name)
          "artifact=$artifact" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            dist/release/*.zip
            dist/release/*.zip.sha256
          retention-days: 7

  unix-package:
    name: unix-package (${{ matrix.platform }})
    needs: release-contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-runtime -> target
          cache-on-failure: true

      - name: Environment
        shell: bash
        run: |
          echo "runner_os=${{ runner.os }}"
          echo "runner_arch=${{ runner.arch }}"
          rustc --version
          rustc -vV | grep '^host:'
          cargo --version
          git --version

      - name: Shared runtime unit tests
        shell: bash
        run: cargo test --locked --manifest-path ./rust-runtime/Cargo.toml

      - name: Unix CLI integration smoke
        shell: bash
        run: cargo test --locked --manifest-path ./rust-runtime/Cargo.toml --test unix_cli -- --test-threads=1

      - name: Build and verify Unix release package
        shell: bash
        run: ./BUILD_UNIX_PACKAGE.sh

      - name: Verify Unix stable artifact version
        shell: bash
        run: |
          metadata="$(find dist -type f -path '*/unix-*/stream-archive/RELEASE_INFO.txt' -print -quit)"
          grep -qx 'version=1.0.0' "$metadata"

      - name: Resolve release artifact
        id: package
        shell: bash
        run: |
          archive="$(find dist/release -maxdepth 1 -type f -name 'stream-archive-*.tar.gz' -print -quit)"
          [[ -n "$archive" ]] || { echo 'Unix release archive was not created.' >&2; exit 1; }
          artifact="$(basename "$archive" .tar.gz)"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            dist/release/*.tar.gz
            dist/release/*.tar.gz.sha256
          retention-days: 7
