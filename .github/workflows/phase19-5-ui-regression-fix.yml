name: Phase 19.5 UI regression fixup

on:
  push:
    branches:
      - fix/phase19-5-ui-regressions
    paths:
      - .github/workflows/phase19-5-ui-regression-fix.yml
      - maintenance/Apply-UiRegressionFix.ps1

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase19-5-ui-regressions
          fetch-depth: 0

      - name: Correct fixup regex boundaries
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $path = 'maintenance/Apply-UiRegressionFix.ps1'
          $text = Get-Content -LiteralPath $path -Raw -Encoding UTF8
          $text = $text.Replace('function action\(a\).*\r?$', 'function action\(a\)[^\r\n]*\r?$')
          $text = $text.Replace('onclick=.*\r?$', 'onclick=[^\r\n]*\r?$')
          $text = $text.Replace('Promise\.all\(\[.*\r?$', 'Promise\.all\(\[[^\r\n]*\r?$')
          $text = $text.Replace("toast('Watcher '+(a==='start'?'start':'stop'))", "toast('Watcher '+(a==='start'?'시작':'중지'))")
          $text = $text.Replace('Assert-Match \$chzzkVod', 'Assert-Match \`$chzzkVod')
          [System.IO.File]::WriteAllText((Resolve-Path -LiteralPath $path), $text, [System.Text.UTF8Encoding]::new($false))

          $lines = [System.IO.File]::ReadAllLines((Resolve-Path -LiteralPath $path))
          $providerGuardFixes = 0
          for ($i = 0; $i -lt $lines.Length; $i++) {
            if ($lines[$i].Contains('if ($providers -notmatch') -and $lines[$i].Contains('main.rs')) {
              $lines[$i] = "if (`$providers.IndexOf('rust-web/src/main.rs', [System.StringComparison]::Ordinal) -lt 0) {"
              $providerGuardFixes++
            }
          }
          if ($providerGuardFixes -ne 1) { throw "provider guard preprocessing expected 1 line, found $providerGuardFixes" }
          [System.IO.File]::WriteAllLines((Resolve-Path -LiteralPath $path), $lines, [System.Text.UTF8Encoding]::new($false))

      - name: Apply focused fixes
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./maintenance/Apply-UiRegressionFix.ps1

      - name: Align strengthened process guards
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $utf8 = [System.Text.UTF8Encoding]::new($false)

          $path = 'maintenance/guards/ProcessLifecycle.ps1'
          $lines = [System.IO.File]::ReadAllLines((Resolve-Path -LiteralPath $path))
          $out = New-Object System.Collections.Generic.List[string]
          $streamlinkGuard = 0
          $ffmpegGuard = 0
          foreach ($line in $lines) {
            if ($line.Contains('CHZZK VOD setup/failure paths must terminate owned Streamlink.')) {
              $out.Add('Assert-Match $chzzkVod ''spawn_owned\(&mut streamlink_command\)'' ''CHZZK VOD Streamlink must enter retained ownership before execution.''')
              $streamlinkGuard++
              continue
            }
            if ($line.Contains('CHZZK VOD cancellation must terminate owned FFmpeg.')) {
              $out.Add('Assert-Match $chzzkVod ''spawn_owned\(&mut ffmpeg_command\)'' ''CHZZK VOD FFmpeg must enter retained ownership before execution.''')
              $out.Add('Assert-Match $chzzkVod ''streamlink_tree\.terminate\(&mut streamlink_child\)'' ''CHZZK VOD cancellation must terminate retained Streamlink ownership.''')
              $out.Add('Assert-Match $chzzkVod ''ffmpeg_tree\.terminate\(&mut ffmpeg_child\)'' ''CHZZK VOD cancellation must terminate retained FFmpeg ownership.''')
              $out.Add('Assert-Match $chzzkVod ''spawn_owned\(&mut command\)'' ''CHZZK VOD analyze commands must use retained ownership.''')
              $out.Add('Assert-NotMatch $chzzkVod ''terminate_owned\(&mut (?:streamlink_child|ffmpeg_child|child)\)'' ''CHZZK VOD must not fall back to compatibility tree recapture for its external tools.''')
              $ffmpegGuard++
              continue
            }
            $out.Add($line)
          }
          if ($streamlinkGuard -ne 1 -or $ffmpegGuard -ne 1) {
            throw "ProcessLifecycle guard replacement mismatch streamlink=$streamlinkGuard ffmpeg=$ffmpegGuard"
          }
          [System.IO.File]::WriteAllLines((Resolve-Path -LiteralPath $path), $out, $utf8)

          $path = 'maintenance/guards/StorageOwnership.ps1'
          $lines = [System.IO.File]::ReadAllLines((Resolve-Path -LiteralPath $path))
          $out = New-Object System.Collections.Generic.List[string]
          $ffmpegStorage = 0
          $streamlinkStorage = 0
          foreach ($line in $lines) {
            if ($line.Contains('Downstream FFmpeg spawn is not handled explicitly.')) {
              $out.Add('Assert-Match $chzzkVod ''spawn_owned\(&mut ffmpeg_command\)'' ''Downstream FFmpeg must establish retained ownership before execution.''')
              $ffmpegStorage++
              continue
            }
            if ($line.Contains('Streamlink owned tree is not explicitly terminated on downstream setup failures.')) {
              $out.Add('Assert-Match $chzzkVod ''streamlink_tree\.terminate\(&mut streamlink_child\)'' ''Streamlink retained tree must be explicitly terminated on downstream setup failures.''')
              $streamlinkStorage++
              continue
            }
            $out.Add($line)
          }
          if ($ffmpegStorage -ne 1 -or $streamlinkStorage -ne 1) {
            throw "StorageOwnership guard replacement mismatch ffmpeg=$ffmpegStorage streamlink=$streamlinkStorage"
          }
          [System.IO.File]::WriteAllLines((Resolve-Path -LiteralPath $path), $out, $utf8)

      - name: Rust format
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: cargo fmt --manifest-path rust-web/Cargo.toml

      - name: Runtime contracts
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./maintenance/Test-RuntimeContracts.ps1

      - name: JavaScript syntax
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $nodeCommand = Get-Command node -ErrorAction SilentlyContinue
          $node = if ($nodeCommand) { $nodeCommand.Source } else { $null }
          if (-not $node) {
            $runnerRoot = Split-Path (Split-Path $env:RUNNER_TEMP -Parent) -Parent
            $node = Get-ChildItem (Join-Path $runnerRoot 'externals') -Directory -Filter 'node*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'bin\node.exe' } |
              Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
              Select-Object -First 1
          }
          if (-not $node) { throw 'Node executable not found' }
          Get-ChildItem ./rust-web/web -Filter *.js | ForEach-Object {
            & $node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failed: $($_.Name)" }
          }

      - name: Rust tests and check
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          cargo test --locked --manifest-path rust-web/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }
          cargo check --locked --manifest-path rust-web/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo check failed' }

      - name: Commit fixes
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust-web/web/app.js rust-web/src/main.rs rust-web/src/platform/soop/vod.rs rust-web/src/platform/chzzk/vod.rs maintenance/guards/Providers.ps1 maintenance/guards/ProcessLifecycle.ps1 maintenance/guards/StorageOwnership.ps1
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          if (git diff --cached --quiet) { Write-Host 'No changes to commit'; exit 0 }
          git commit -m "Fix Phase 19.5 UI and CHZZK cancellation regressions"
          git push origin HEAD:fix/phase19-5-ui-regressions
