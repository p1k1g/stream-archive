name: Phase 19.5 UI regression fixup

on:
  push:
    branches:
      - fix/phase19-5-ui-regressions
    paths:
      - .github/workflows/phase19-5-ui-regression-fix.yml
      - maintenance/Apply-UiRegressionFix.ps1

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase19-5-ui-regressions
          fetch-depth: 0

      - name: Correct fixup regex boundaries
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $path = 'maintenance/Apply-UiRegressionFix.ps1'
          $text = Get-Content -LiteralPath $path -Raw -Encoding UTF8
          $text = $text.Replace('function action\(a\).*\r?$', 'function action\(a\)[^\r\n]*\r?$')
          $text = $text.Replace('onclick=.*\r?$', 'onclick=[^\r\n]*\r?$')
          $text = $text.Replace('Promise\.all\(\[.*\r?$', 'Promise\.all\(\[[^\r\n]*\r?$')
          $text = $text.Replace("toast('Watcher '+(a==='start'?'start':'stop'))", "toast('Watcher '+(a==='start'?'시작':'중지'))")
          [System.IO.File]::WriteAllText((Resolve-Path -LiteralPath $path), $text, [System.Text.UTF8Encoding]::new($false))

      - name: Apply focused fixes
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./maintenance/Apply-UiRegressionFix.ps1

      - name: Rust format
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: cargo fmt --manifest-path rust-web/Cargo.toml

      - name: Runtime contracts
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./maintenance/Test-RuntimeContracts.ps1

      - name: JavaScript syntax
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $nodeCommand = Get-Command node -ErrorAction SilentlyContinue
          $node = if ($nodeCommand) { $nodeCommand.Source } else { $null }
          if (-not $node) {
            $runnerRoot = Split-Path (Split-Path $env:RUNNER_TEMP -Parent) -Parent
            $node = Get-ChildItem (Join-Path $runnerRoot 'externals') -Directory -Filter 'node*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'bin\node.exe' } |
              Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
              Select-Object -First 1
          }
          if (-not $node) { throw 'Node executable not found' }
          Get-ChildItem ./rust-web/web -Filter *.js | ForEach-Object {
            & $node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failed: $($_.Name)" }
          }

      - name: Rust tests and check
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          cargo test --locked --manifest-path rust-web/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }
          cargo check --locked --manifest-path rust-web/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo check failed' }

      - name: Commit fixes
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust-web/web/app.js rust-web/src/main.rs rust-web/src/platform/soop/vod.rs rust-web/src/platform/chzzk/vod.rs maintenance/guards/Providers.ps1 maintenance/guards/ProcessLifecycle.ps1 maintenance/guards/StorageOwnership.ps1
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          if (git diff --cached --quiet) { Write-Host 'No changes to commit'; exit 0 }
          git commit -m "Fix Phase 19.5 UI and CHZZK cancellation regressions"
          git push origin HEAD:fix/phase19-5-ui-regressions
