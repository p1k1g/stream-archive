name: Phase 26 temporary formatter
on:
  pull_request:
    branches: [main]
jobs:
  format:
    if: github.head_ref == 'phase26-2-kick-vod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          cargo fmt --manifest-path rust-runtime/Cargo.toml
          cargo fmt --manifest-path rust-gui/Cargo.toml
          git diff --binary > phase26-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: phase26-format
          path: phase26-format.patch
