            let limit_text = state.get_history_limit().to_string();
            let limit = if limit_text.trim().is_empty() {
                None
            } else {
                match limit_text.trim().parse::<usize>() {
                    Ok(limit) => Some(limit),
                    Err(_) => {
                        state.set_history_message("History limit must be a positive integer.".into());
                        return;
                    }
                }
