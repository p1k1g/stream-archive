name: Phase 19.5 namespace fixup

on:
  push:
    branches:
      - phase19.5-stream-archive-namespace

permissions:
  contents: write

jobs:
  fixup:
    if: github.event.head_commit.message != 'Apply Stream Archive namespace cleanup'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase19.5-stream-archive-namespace
          fetch-depth: 0

      - name: Apply namespace cleanup
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'

          function Write-Utf8NoBom {
            param([string]$Path,[string]$Text)
            [IO.File]::WriteAllText((Resolve-Path -LiteralPath $Path), $Text, [Text.UTF8Encoding]::new($false))
          }
          function Replace-Literal {
            param(
              [Parameter(Mandatory=$true)][string]$Path,
              [Parameter(Mandatory=$true)][string]$Old,
              [Parameter(Mandatory=$true)][AllowEmptyString()][string]$New,
              [switch]$Optional
            )
            $text = Get-Content -LiteralPath $Path -Raw -Encoding UTF8
            if (-not $text.Contains($Old)) {
              if ($Optional) { return }
              throw "Expected text not found in $Path : $Old"
            }
            Write-Utf8NoBom $Path ($text.Replace($Old, $New))
          }
          function Replace-Regex {
            param(
              [Parameter(Mandatory=$true)][string]$Path,
              [Parameter(Mandatory=$true)][string]$Pattern,
              [Parameter(Mandatory=$true)][AllowEmptyString()][string]$Replacement,
              [switch]$Optional
            )
            $text = Get-Content -LiteralPath $Path -Raw -Encoding UTF8
            $regex = [regex]::new($Pattern, [Text.RegularExpressions.RegexOptions]::Singleline)
            if (-not $regex.IsMatch($text)) {
              if ($Optional) { return }
              throw "Expected pattern not found in $Path : $Pattern"
            }
            Write-Utf8NoBom $Path ($regex.Replace($text, $Replacement))
          }

          Replace-Literal 'rust-web/Cargo.lock' 'name = "soop-web"' 'name = "stream-archive-server"'

          Replace-Literal 'rust-web/src/platform/chzzk/vod.rs' '.soop-downloader.claim' '.stream-archive.claim'
          Replace-Literal 'rust-web/src/platform/chzzk/vod.rs' '.soop-downloader.finalizing' '.stream-archive.finalizing'
          Replace-Literal 'maintenance/guards/StorageOwnership.ps1' '\.soop-downloader\.claim' '\.stream-archive\.claim'
          Replace-Literal 'maintenance/guards/StorageOwnership.ps1' '\.soop-downloader\.finalizing' '\.stream-archive\.finalizing'

          # CI already covers rust-web/**; the old per-file main.rs assertion is redundant.
          Replace-Regex 'maintenance/guards/StorageOwnership.ps1' "[^\r\n]*Runtime workflow must trigger when main\.rs startup ordering changes\.'\r?\n?" ''

          # The INI/TXT channel migration was intentionally retired before public release.
          Replace-Regex 'maintenance/guards/Providers.ps1' '# Legacy channel-file migration must preserve LF, CRLF, and lone-CR compatibility\..*?(?=# API-side validation)' ''

          $index = 'rust-web/web/index.html'
          Replace-Regex $index '<button id="restoreChannels"[^>]*>.*?</button>\s*' ''
          Replace-Regex $index '<input id="channelBackupFile"[^>]*>' ''
          Replace-Regex $index '<p class="hint">[^<]*SOOP_LIVE_CHANNELS\.txt[^<]*</p>' ''
          Replace-Regex $index '<section style="display:none" aria-hidden="true">.*?id="vodHistory".*?</section>' ''
          Replace-Regex $index '<button id="importSettings"[^>]*>.*?</button>\s*' ''
          Replace-Regex $index '<input id="settingsImportFile"[^>]*>' ''
          Replace-Regex $index '<p class="hint">[^<]*SOOP_LIVE_SETTING\.ini[^<]*</p>' '<p class="hint">SQLite is the canonical settings and channel store.</p>'
          Replace-Regex $index '<p class="hint">Phase 7[^<]*</p>' ''
          Replace-Literal $index '<strong><i></i> SOOP</strong>' '<strong><i></i> SOOP / CHZZK</strong>'
          Replace-Regex $index '(<strong><i></i> SOOP / CHZZK</strong>)\s*<small>.*?</small>' '$1<small>LIVE / VOD</small>'
          Replace-Literal $index 'C:\SOOP_VOD' 'C:\StreamArchive\VOD'
          Replace-Literal $index 'soop-recorder-backups' 'stream-archive-backups'
          Replace-Literal $index 'SOOP_BACKUP_DIR' 'STREAM_ARCHIVE_BACKUP_DIR'
          Replace-Literal $index 'xDetachLegacyBackupSave' 'xDetachInlineBackupSave'

          Replace-Literal 'rust-web/web/phase14.js' 'soop-recorder-backups' 'stream-archive-backups' -Optional
          Replace-Literal 'rust-web/web/phase14.js' 'SOOP_BACKUP_DIR' 'STREAM_ARCHIVE_BACKUP_DIR' -Optional

          $oldEnv = [ordered]@{
            'SOOP_WEB_BIND'='STREAM_ARCHIVE_BIND'
            'SOOP_WEB_TOKEN'='STREAM_ARCHIVE_TOKEN'
            'SOOP_START_WATCHER'='STREAM_ARCHIVE_START_WATCHER'
            'SOOP_DATA_DIR'='STREAM_ARCHIVE_DATA_DIR'
            'SOOP_BACKUP_DIR'='STREAM_ARCHIVE_BACKUP_DIR'
            'SOOP_BACKEND_DIR'='STREAM_ARCHIVE_BACKEND_DIR'
            'SOOP_NO_PAUSE'='STREAM_ARCHIVE_NO_PAUSE'
          }
          $tracked = git ls-files
          foreach ($path in $tracked) {
            if ($path -in @('.github/workflows/phase19-5-namespace-fixup.yml','maintenance/guards/ReleaseSafety.ps1')) { continue }
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { continue }
            $ext = [IO.Path]::GetExtension($path).ToLowerInvariant()
            if ($ext -notin @('.rs','.js','.html','.css','.md','.ps1','.bat','.cmd','.yml','.yaml','.toml','.txt','.ini')) { continue }
            $text = Get-Content -LiteralPath $path -Raw -Encoding UTF8
            $next = $text
            foreach ($entry in $oldEnv.GetEnumerator()) { $next = $next.Replace($entry.Key, $entry.Value) }
            if ($next -ne $text) { Write-Utf8NoBom $path $next }
          }

          cargo fmt --manifest-path rust-web/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }

      - name: Runtime contracts
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./maintenance/Test-RuntimeContracts.ps1

      - name: Rust format
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: cargo fmt --manifest-path rust-web/Cargo.toml -- --check

      - name: Rust tests
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: cargo test --locked --manifest-path rust-web/Cargo.toml

      - name: Rust check
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: cargo check --locked --manifest-path rust-web/Cargo.toml

      - name: JavaScript syntax
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $nodeCommand = Get-Command node -ErrorAction SilentlyContinue
          $node = if ($nodeCommand) { $nodeCommand.Source } else { $null }
          if (-not $node) {
            $runnerRoot = Split-Path (Split-Path $env:RUNNER_TEMP -Parent) -Parent
            $node = Get-ChildItem (Join-Path $runnerRoot 'externals') -Directory -Filter 'node*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'bin\node.exe' } |
              Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
              Select-Object -First 1
          }
          if (-not $node) { throw 'Node executable was not found on PATH or in the GitHub runner externals directory.' }
          & $node --version
          if ($LASTEXITCODE -ne 0) { throw 'Node version check failed.' }
          Get-ChildItem ./rust-web/web -Filter *.js | ForEach-Object {
            & $node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $($_.Name)" }
          }

      - name: Commit fixup
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if (git diff --cached --quiet) {
            Write-Host 'No fixup changes required.'
            exit 0
          }
          git commit -m "Apply Stream Archive namespace cleanup"
          git push origin HEAD:phase19.5-stream-archive-namespace
