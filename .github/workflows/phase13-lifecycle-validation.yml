name: Phase 13 lifecycle validation

on:
  push:
    branches: [phase13-vod-queue-alerts]
    paths:
      - .github/workflows/phase13-lifecycle-validation.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase13-vod-queue-alerts
          fetch-depth: 0
      - name: Apply lifecycle hardening
        shell: cmd
        run: python .github\phase13_lifecycle_fix.py
      - name: Rust unit tests
        shell: cmd
        run: cargo test --locked --manifest-path rust-web\Cargo.toml
      - name: Windows native compile check
        shell: cmd
        run: cargo check --locked --manifest-path rust-web\Cargo.toml
      - name: Windows portable package smoke
        shell: cmd
        run: PACKAGE_RUST_WEB.bat
      - name: Verify portable package
        shell: cmd
        run: |
          if not exist dist\soop-recorder\soop-server.exe exit /b 1
          if not exist dist\soop-recorder\soop-launcher.exe exit /b 1
          if not exist dist\soop-recorder\RUN.bat exit /b 1
          if not exist dist\soop-recorder\SHA256SUMS.txt exit /b 1
      - name: Commit validated lifecycle fixes
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust-web\src\vod.rs rust-web\src\main.rs rust-web\src\vod_queue.rs
          git rm .github\phase13_lifecycle_fix.py
          git commit -m "fix: serialize Phase 13 VOD lifecycle transitions"
          git push origin HEAD:phase13-vod-queue-alerts
