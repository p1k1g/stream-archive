name: Phase 12 Codex review fixes

on:
  push:
    branches: [phase12-backup-retention]
    paths:
      - .github/workflows/phase12-codex-review-fix.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase12-backup-retention
          fetch-depth: 0
      - name: Apply Codex review fixes
        shell: cmd
        run: python .github\phase12_codex_review_fix.py
      - name: Format changed Rust source
        shell: cmd
        run: |
          cargo fmt --manifest-path rust-web\Cargo.toml
          git add rust-web\src\main.rs rust-web\src\store.rs rust-web\src\auth.rs rust-web\src\backup.rs
          git checkout -- .
          git reset rust-web\src\main.rs rust-web\src\store.rs rust-web\src\auth.rs rust-web\src\backup.rs
      - name: Rust unit tests
        shell: cmd
        run: cargo test --locked --manifest-path rust-web\Cargo.toml
      - name: Windows native compile check
        shell: cmd
        run: cargo check --locked --manifest-path rust-web\Cargo.toml
      - name: Windows portable package smoke
        shell: cmd
        run: PACKAGE_RUST_WEB.bat
      - name: Verify portable package
        shell: cmd
        run: |
          if not exist dist\soop-recorder\soop-server.exe exit /b 1
          if not exist dist\soop-recorder\soop-launcher.exe exit /b 1
          if not exist dist\soop-recorder\RUN.bat exit /b 1
          if not exist dist\soop-recorder\BACKUP_DATA.bat exit /b 1
          if not exist dist\soop-recorder\RESTORE_DATA.bat exit /b 1
          if not exist dist\soop-recorder\SHA256SUMS.txt exit /b 1
      - name: Commit validated fixes
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust-web\src\main.rs rust-web\src\store.rs rust-web\src\auth.rs rust-web\src\backup.rs maintenance\Backup-SoopData.ps1
          git rm .github\phase12_codex_review_fix.py
          git commit -m "fix: address Phase 12 Codex review findings"
          git push origin HEAD:phase12-backup-retention
