name: Fix Phase 21.6 native compile errors

on:
  push:
    branches: [phase21-queue-history]
    paths: [.github/workflows/fix-phase21-6-compile.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase21-queue-history
          fetch-depth: 0

      - name: Patch compile errors
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          # Re-export the imported Slint global from the root module so Rust's
          # include_modules! exposes QueueHistoryState beside the row structs.
          path = Path('rust-gui/ui/app-window.slint')
          text = path.read_text(encoding='utf-8')
          old = 'import { QueuePage, HistoryPage, QueueHistoryState } from "queue-history.slint";'
          new = 'import { QueuePage, HistoryPage } from "queue-history.slint";\nexport { QueueHistoryState } from "queue-history.slint";'
          if old not in text:
              raise SystemExit('app-window QueueHistoryState import anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Avoid adding an anyhow dependency to rust-gui. All queue facade
          # branches already infer anyhow::Result from StreamArchiveCore, and
          # std::io::Error converts through the existing result error type.
          path = Path('rust-gui/src/controller.rs')
          text = path.read_text(encoding='utf-8')
          old = '_ => Err(anyhow::anyhow!("unsupported queue action: {action}")),'
          new = '_ => Err(std::io::Error::new(\n                        std::io::ErrorKind::InvalidInput,\n                        format!("unsupported queue action: {action}"),\n                    )\n                    .into()),'
          if old not in text:
              raise SystemExit('controller anyhow anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Unknown queue states borrow the input, so the label cannot be
          # declared &'static. Return an owned String for every state label.
          path = Path('rust-gui/src/queue_adapter.rs')
          text = path.read_text(encoding='utf-8')
          old = '''fn state_meta(state: &str) -> (&'static str, &'static str) {
              match state {
                  "QUEUED" => ("Queued", "neutral"),
                  "STARTING" => ("Starting", "warn"),
                  "RUNNING" => ("Running", "ok"),
                  "CANCELLING" => ("Cancelling", "warn"),
                  "COMPLETED" => ("Completed", "ok"),
                  "FAILED" => ("Failed", "error"),
                  "CANCELLED" => ("Cancelled", "neutral"),
                  "INTERRUPTED" => ("Interrupted", "warn"),
                  other => (other, "neutral"),
              }
          }'''
          new = '''fn state_meta(state: &str) -> (String, &'static str) {
              match state {
                  "QUEUED" => ("Queued".into(), "neutral"),
                  "STARTING" => ("Starting".into(), "warn"),
                  "RUNNING" => ("Running".into(), "ok"),
                  "CANCELLING" => ("Cancelling".into(), "warn"),
                  "COMPLETED" => ("Completed".into(), "ok"),
                  "FAILED" => ("Failed".into(), "error"),
                  "CANCELLED" => ("Cancelled".into(), "neutral"),
                  "INTERRUPTED" => ("Interrupted".into(), "warn"),
                  other => (other.to_owned(), "neutral"),
              }
          }'''
          if old not in text:
              raise SystemExit('queue state_meta anchor missing')
          text = text.replace(old, new, 1)
          # state_label is already a String after the change.
          text = text.replace('state_label: state_label.into(),', 'state_label,', 1)
          path.write_text(text, encoding='utf-8')

          # Remove the now-unused import reported by rustc.
          path = Path('rust-gui/src/vod_adapter.rs')
          text = path.read_text(encoding='utf-8')
          text = text.replace('VodJobStatus, VodPartInfo, VodQualityOption,', 'VodJobStatus, VodQualityOption,', 1)
          path.write_text(text, encoding='utf-8')
          '@ | python -

      - name: Format
        run: cargo fmt --manifest-path rust-gui/Cargo.toml

      - name: Check native GUI
        run: cargo check --locked --manifest-path rust-gui/Cargo.toml

      - name: Test native GUI
        run: cargo test --locked --manifest-path rust-gui/Cargo.toml

      - name: Commit fixes and remove temporary workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/fix-phase21-6-compile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust-gui/ui/app-window.slint rust-gui/src/controller.rs rust-gui/src/queue_adapter.rs rust-gui/src/vod_adapter.rs .github/workflows/fix-phase21-6-compile.yml
          git commit -m "Fix Phase 21.6 native GUI compile errors"
          git push origin HEAD:phase21-queue-history
