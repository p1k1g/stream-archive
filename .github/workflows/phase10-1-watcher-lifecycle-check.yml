name: Phase 10.1 watcher lifecycle validation

on:
  push:
    branches: [phase10.1-auth-overlay-fix]
    paths:
      - .github/workflows/phase10-1-watcher-lifecycle-check.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase10.1-auth-overlay-fix
          fetch-depth: 0
      - name: Apply lifecycle patch
        shell: cmd
        run: python .github\phase10_1_watcher_lifecycle_patch.py
      - name: Rust format
        shell: cmd
        run: cargo fmt --manifest-path rust-web\Cargo.toml
      - name: Rust unit tests
        shell: cmd
        run: cargo test --locked --manifest-path rust-web\Cargo.toml
      - name: Windows native compile check
        shell: cmd
        run: cargo check --locked --manifest-path rust-web\Cargo.toml
      - name: Windows portable package smoke
        shell: cmd
        run: PACKAGE_RUST_WEB.bat
      - name: Verify portable package
        shell: cmd
        run: |
          if not exist dist\soop-recorder\soop-server.exe exit /b 1
          if not exist dist\soop-recorder\soop-launcher.exe exit /b 1
          if not exist dist\soop-recorder\RUN.bat exit /b 1
          if not exist dist\soop-recorder\SHA256SUMS.txt exit /b 1
      - name: Commit validated source
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust-web\src\native_watcher.rs rust-web\src\recorder.rs
          git rm .github\phase10_1_watcher_lifecycle_patch.py
          git commit -m "Phase 10.1: harden watcher lifecycle and orphan recorder handling"
          git push origin HEAD:phase10.1-auth-overlay-fix
