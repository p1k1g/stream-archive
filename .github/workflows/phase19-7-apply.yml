name: Phase 19.7 apply

on:
  push:
    branches:
      - codex/perform-phase-19-runtime-hardening
    paths:
      - ".github/scripts/phase19_7_apply.py"
      - ".github/workflows/phase19-7-apply.yml"
  workflow_dispatch:

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/perform-phase-19-runtime-hardening
          fetch-depth: 0

      - name: Apply Phase 19.7 patch
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          python .github/scripts/phase19_7_apply.py
          git add -A
          git diff --cached --check

      - name: Runtime contract guard
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./maintenance/Test-RuntimeContracts.ps1

      - name: Rust format check
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: cargo fmt --manifest-path rust-web/Cargo.toml -- --check

      - name: Rust unit tests
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: cargo test --locked --manifest-path rust-web/Cargo.toml

      - name: Rust check
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: cargo check --locked --manifest-path rust-web/Cargo.toml

      - name: JavaScript syntax check
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $nodeCommand = Get-Command node -ErrorAction SilentlyContinue
          if ($nodeCommand) {
            Get-ChildItem ./rust-web/web -Filter *.js | ForEach-Object {
              & $nodeCommand.Source --check $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $($_.Name)" }
            }
          } else {
            Write-Host 'node is unavailable in this temporary apply workflow; standard Rust web CI will perform the JS syntax check.'
          }

      - name: Commit Phase 19.7
        shell: cmd
        run: |
          git rm .github\scripts\phase19_7_apply.py .github\workflows\phase19-7-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 19.7: consolidate runtime contract guards"
          git push origin HEAD:codex/perform-phase-19-runtime-hardening
