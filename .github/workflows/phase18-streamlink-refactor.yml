name: Phase 18 Streamlink refactor

on:
  pull_request:
    branches: [main]
    paths:
      - "rust-web/src/platform/chzzk/vod.rs"
      - ".github/workflows/phase18-chzzk-vod-check.yml"
      - ".github/workflows/phase18-streamlink-refactor.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase18-streamlink-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refactor:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase18-chzzk-vod
          fetch-depth: 0

      - name: Apply refactor from corrected generator
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $workflow = Get-Content -LiteralPath '.github/workflows/phase18-chzzk-vod-check.yml' -Raw -Encoding UTF8
          $startMarker = "@'`n"
          $endMarker = "`n'@ | Set-Content -LiteralPath `$env:RUNNER_TEMP\phase18_streamlink_refactor.py -Encoding UTF8"
          $start = $workflow.IndexOf($startMarker)
          if ($start -lt 0) { throw 'embedded refactor generator start marker not found' }
          $start += $startMarker.Length
          $end = $workflow.IndexOf($endMarker, $start)
          if ($end -lt 0) { throw 'embedded refactor generator end marker not found' }
          $py = $workflow.Substring($start, $end - $start)
          $py = $py.Replace('\"', '"')
          $script = Join-Path $env:RUNNER_TEMP 'phase18_streamlink_refactor_fixed.py'
          [System.IO.File]::WriteAllText($script, $py, (New-Object System.Text.UTF8Encoding($false)))
          python $script
          if ($LASTEXITCODE -ne 0) { throw "refactor generator failed: $LASTEXITCODE" }
          rustfmt --edition 2024 rust-web/src/platform/chzzk/vod.rs
          if ($LASTEXITCODE -ne 0) { throw 'rustfmt apply failed' }

          $source = Get-Content -LiteralPath rust-web/src/platform/chzzk/vod.rs -Raw -Encoding UTF8
          if ($source -notmatch 'struct ChzzkTools') { throw 'ChzzkTools missing' }
          if ($source -notmatch 'run_streamlink_process') { throw 'Streamlink transport missing' }
          if ($source -match '"--dump-single-json"|"--merge-output-format"|run_ffmpeg_fallback') {
            throw 'legacy yt-dlp/public DASH fallback remains in CHZZK provider'
          }

      - name: Rust tests and check
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          rustfmt --edition 2024 --check rust-web/src/platform/chzzk/vod.rs
          if ($LASTEXITCODE -ne 0) { throw 'rustfmt check failed' }
          cargo test --locked --manifest-path rust-web/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }
          cargo check --locked --manifest-path rust-web/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo check failed' }

      - name: Verify public CHZZK Streamlink
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $streamlink = 'C:\Program Files\Streamlink\bin\streamlink.exe'
          if (-not (Test-Path -LiteralPath $streamlink -PathType Leaf)) { throw 'streamlink.exe not found' }
          $json = & $streamlink --no-config --json 'https://chzzk.naver.com/video/15185683'
          if ($LASTEXITCODE -ne 0) { throw 'streamlink json failed' }
          $obj = $json | ConvertFrom-Json
          $names = @($obj.streams.PSObject.Properties.Name)
          Write-Host "qualities=$($names -join ',')"
          if ($names -notcontains '1080p') { throw '1080p missing' }
          $out = Join-Path $env:RUNNER_TEMP 'chzzk-vod-streamlink-smoke.ts'
          Remove-Item -LiteralPath $out -Force -ErrorAction SilentlyContinue
          & $streamlink --no-config --stream-segmented-duration 8 --output $out 'https://chzzk.naver.com/video/15185683' best
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $out -PathType Leaf)) { throw 'streamlink download smoke failed' }
          if ((Get-Item -LiteralPath $out).Length -lt 1880) { throw 'streamlink output too small' }
          Remove-Item -LiteralPath $out -Force -ErrorAction SilentlyContinue

      - name: Commit source refactor
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust-web/src/platform/chzzk/vod.rs
          if (git diff --cached --quiet) {
            Write-Host 'Source refactor already committed.'
            exit 0
          }
          git commit -m 'Use Streamlink for CHZZK VOD transport'
          if ($LASTEXITCODE -ne 0) { throw 'commit failed' }
          git push origin HEAD:phase18-chzzk-vod
          if ($LASTEXITCODE -ne 0) { throw 'push failed' }
