name: Phase 18 Streamlink TS refactor

on:
  pull_request:
    branches: [main]
    paths:
      - "maintenance/phase18_streamlink_ts_patch.py"
      - ".github/workflows/phase18-streamlink-refactor.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase18-streamlink-ts-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refactor:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase18-chzzk-vod
          fetch-depth: 0

      - name: Apply CHZZK Streamlink TS refactor
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          python maintenance/phase18_streamlink_ts_patch.py
          if ($LASTEXITCODE -ne 0) { throw "patch failed: $LASTEXITCODE" }
          rustfmt --edition 2024 rust-web/src/platform/chzzk/vod.rs rust-web/src/recorder.rs
          if ($LASTEXITCODE -ne 0) { throw 'rustfmt apply failed' }

      - name: Rust tests and check
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          rustfmt --edition 2024 --check rust-web/src/platform/chzzk/vod.rs rust-web/src/recorder.rs
          if ($LASTEXITCODE -ne 0) { throw 'rustfmt check failed' }
          cargo test --locked --manifest-path rust-web/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }
          cargo check --locked --manifest-path rust-web/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'cargo check failed' }

      - name: Verify public CHZZK Streamlink path
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $streamlink = 'C:\Program Files\Streamlink\bin\streamlink.exe'
          $ffmpeg = 'C:\Program Files\Streamlink\ffmpeg\ffmpeg.exe'
          if (-not (Test-Path -LiteralPath $streamlink -PathType Leaf)) { throw 'streamlink.exe not found' }
          if (-not (Test-Path -LiteralPath $ffmpeg -PathType Leaf)) { throw 'bundled ffmpeg.exe not found' }
          $json = & $streamlink --no-config --json --ffmpeg-ffmpeg $ffmpeg 'https://chzzk.naver.com/video/15185683'
          if ($LASTEXITCODE -ne 0) { throw 'streamlink json failed' }
          $obj = $json | ConvertFrom-Json
          $names = @($obj.streams.PSObject.Properties.Name)
          Write-Host "qualities=$($names -join ',')"
          if ($names -notcontains '1080p') { throw '1080p missing' }

      - name: Commit refactor
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust-web/src/platform/chzzk/vod.rs rust-web/src/recorder.rs
          if (git diff --cached --quiet) {
            Write-Host 'Refactor already applied.'
            exit 0
          }
          git commit -m 'Use LIVE-style Streamlink TS pipeline for CHZZK VOD'
          if ($LASTEXITCODE -ne 0) { throw 'commit failed' }
          git push origin HEAD:phase18-chzzk-vod
          if ($LASTEXITCODE -ne 0) { throw 'push failed' }
