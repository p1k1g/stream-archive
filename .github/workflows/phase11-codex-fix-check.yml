name: Phase 11 Codex review fix validation

on:
  push:
    branches: [phase11-realtime-sse]
    paths:
      - .github/workflows/phase11-codex-fix-check.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase11-realtime-sse
          fetch-depth: 0
      - name: Apply Codex review fixes
        shell: cmd
        run: python .github\phase11_codex_fix.py
      - name: Rust format
        shell: cmd
        run: cargo fmt --manifest-path rust-web\Cargo.toml
      - name: Rust unit tests
        shell: cmd
        run: cargo test --locked --manifest-path rust-web\Cargo.toml
      - name: Windows native compile check
        shell: cmd
        run: cargo check --locked --manifest-path rust-web\Cargo.toml
      - name: Windows portable package smoke
        shell: cmd
        run: PACKAGE_RUST_WEB.bat
      - name: Verify portable package
        shell: cmd
        run: |
          if not exist dist\soop-recorder\soop-server.exe exit /b 1
          if not exist dist\soop-recorder\soop-launcher.exe exit /b 1
          if not exist dist\soop-recorder\RUN.bat exit /b 1
          if not exist dist\soop-recorder\SHA256SUMS.txt exit /b 1
      - name: Commit validated source
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust-web\src\auth.rs rust-web\src\realtime.rs
          git rm .github\phase11_codex_fix.py
          git commit -m "fix: harden Phase 11 SSE session auth"
          git push origin HEAD:phase11-realtime-sse
