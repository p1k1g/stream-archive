name: Stream Archive check

on:
  pull_request:
    paths:
      - "rust-web/**"
      - "RUN_DEV.bat"
      - "BUILD_RELEASE.bat"
      - "BUILD_PORTABLE.bat"
      - "maintenance/**"
      - "docs/**"
      - "deploy/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: stream-archive-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-check:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          git --version

      - name: Runtime contract guard
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./maintenance/Test-RuntimeContracts.ps1

      - name: JavaScript syntax check
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $nodeCommand = Get-Command node -ErrorAction SilentlyContinue
          $node = if ($nodeCommand) { $nodeCommand.Source } else { $null }
          if (-not $node) {
            $runnerRoot = Split-Path (Split-Path $env:RUNNER_TEMP -Parent) -Parent
            $node = Get-ChildItem (Join-Path $runnerRoot 'externals') -Directory -Filter 'node*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'bin\node.exe' } |
              Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
              Select-Object -First 1
          }
          if (-not $node) { throw 'Node executable was not found on PATH or in the GitHub runner externals directory.' }
          & $node --version
          if ($LASTEXITCODE -ne 0) { throw 'Node version check failed.' }
          Get-ChildItem ./rust-web/web -Filter *.js | ForEach-Object {
            & $node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $($_.Name)" }
          }

      - name: Rust format check
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: cargo fmt --manifest-path rust-web/Cargo.toml -- --check

      - name: Rust unit tests
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: cargo test --locked --manifest-path rust-web/Cargo.toml

      - name: Windows native compile check
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: cargo check --locked --manifest-path rust-web/Cargo.toml

      - name: Rust clippy advisory
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: cargo clippy --locked --manifest-path rust-web/Cargo.toml --all-targets

      - name: Windows portable package smoke
        shell: cmd
        run: BUILD_PORTABLE.bat

      - name: Verify portable package
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $root = './dist/stream-archive'
          $required = @(
            "$root/stream-archive-server.exe",
            "$root/stream-archive-launcher.exe",
            "$root/RUN.bat",
            "$root/RUN_SERVER_CONSOLE.bat",
            "$root/BACKUP_DATA.bat",
            "$root/RESTORE_DATA.bat",
            "$root/Caddyfile.example",
            "$root/RELEASE_INFO.txt",
            "$root/SHA256SUMS.txt",
            "$root/maintenance/Backup-StreamArchiveData.ps1",
            "$root/maintenance/Restore-StreamArchiveData.ps1",
            "$root/docs/OPERATIONS.md",
            "$root/docs/REVERSE_PROXY.md",
            "$root/docs/LOCAL_LAUNCHER.md"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing package file: $path" }
          }

          $expected = @{}
          foreach ($line in Get-Content "$root/SHA256SUMS.txt") {
            if ($line -match '^([0-9a-fA-F]{64})\s+(.+)$') {
              $expected[$matches[2].Trim()] = $matches[1].ToLowerInvariant()
            }
          }
          foreach ($name in @('stream-archive-server.exe', 'stream-archive-launcher.exe')) {
            if (-not $expected.ContainsKey($name)) { throw "checksum missing: $name" }
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $root $name)).Hash.ToLowerInvariant()
            if ($expected[$name] -ne $actual) { throw "$name checksum mismatch" }
          }

          $run = Get-Content "$root/RUN.bat" -Raw
          if ($run -notmatch 'stream-archive-launcher\.exe') { throw 'RUN.bat does not use stream-archive-launcher.exe' }

          $direct = Get-Content "$root/RUN_SERVER_CONSOLE.bat" -Raw
          if ($direct -notmatch 'stream-archive-server\.exe') { throw 'RUN_SERVER_CONSOLE.bat does not start stream-archive-server.exe' }

          $caddy = Get-Content "$root/Caddyfile.example" -Raw
          if ($caddy -notmatch 'reverse_proxy\s+127\.0\.0\.1:8787') { throw 'Caddy template upstream mismatch' }

          $metadata = cargo metadata --locked --no-deps --format-version 1 --manifest-path ./rust-web/Cargo.toml | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          $cargoVersion = ($metadata.packages | Where-Object { $_.name -eq 'stream-archive-server' } | Select-Object -First 1).version
          if ([string]::IsNullOrWhiteSpace($cargoVersion)) { throw 'stream-archive-server version not found in cargo metadata' }

          $releaseMap = @{}
          foreach ($line in Get-Content "$root/RELEASE_INFO.txt") {
            $clean = $line.Trim().TrimStart([char]0xFEFF)
            if ($clean -match '^([^=]+)=(.*)$') {
              $releaseMap[$matches[1].Trim()] = $matches[2].Trim()
            }
          }
          if ($releaseMap['product'] -ne 'Stream Archive') { throw 'release metadata product mismatch' }
          if (-not $releaseMap.ContainsKey('version')) { throw 'release metadata missing version key' }
          if ($releaseMap['version'] -ne $cargoVersion) { throw "release metadata version mismatch: expected $cargoVersion actual $($releaseMap['version'])" }
