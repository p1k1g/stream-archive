name: Rust web check

on:
  push:
    paths:
      - "rust-web/**"
      - "BUILD_RUST_WEB.bat"
      - "RUN_RUST_WEB.bat"
      - "PACKAGE_RUST_WEB.bat"
      - "maintenance/**"
      - "docs/**"
      - "backend/*.example.*"
      - "backend/vod/*.example.ini"
      - ".github/workflows/rust-web-check.yml"
      - ".github/workflows/rust-web-release.yml"
  pull_request:
    paths:
      - "rust-web/**"
      - "BUILD_RUST_WEB.bat"
      - "RUN_RUST_WEB.bat"
      - "PACKAGE_RUST_WEB.bat"
      - "maintenance/**"
      - "docs/**"
      - "backend/*.example.*"
      - "backend/vod/*.example.ini"
      - ".github/workflows/rust-web-check.yml"
      - ".github/workflows/rust-web-release.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests
        run: cargo test --locked --manifest-path rust-web/Cargo.toml

  windows-check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Windows native compile check
        run: cargo check --locked --manifest-path rust-web/Cargo.toml
      - name: Windows portable package smoke
        shell: cmd
        run: PACKAGE_RUST_WEB.bat
      - name: Verify portable package
        shell: pwsh
        run: |
          $required = @(
            './dist/soop-recorder/soop-server.exe',
            './dist/soop-recorder/RUN.bat',
            './dist/soop-recorder/BACKUP_DATA.bat',
            './dist/soop-recorder/RESTORE_DATA.bat',
            './dist/soop-recorder/RELEASE_INFO.txt',
            './dist/soop-recorder/SHA256SUMS.txt',
            './dist/soop-recorder/maintenance/Backup-SoopData.ps1',
            './dist/soop-recorder/maintenance/Restore-SoopData.ps1',
            './dist/soop-recorder/docs/OPERATIONS.md',
            './dist/soop-recorder/docs/REVERSE_PROXY.md'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing package file: $path" }
          }

          $expected = (Get-Content ./dist/soop-recorder/SHA256SUMS.txt -Raw).Trim().Split()[0]
          $actual = (Get-FileHash -Algorithm SHA256 ./dist/soop-recorder/soop-server.exe).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'soop-server.exe checksum mismatch' }

          $metadata = cargo metadata --locked --no-deps --format-version 1 --manifest-path ./rust-web/Cargo.toml | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          $cargoVersion = ($metadata.packages | Where-Object { $_.name -eq 'soop-web' } | Select-Object -First 1).version
          if ([string]::IsNullOrWhiteSpace($cargoVersion)) { throw 'soop-web version not found in cargo metadata' }

          $releaseMap = @{}
          foreach ($line in Get-Content ./dist/soop-recorder/RELEASE_INFO.txt) {
            $clean = $line.Trim().TrimStart([char]0xFEFF)
            if ($clean -match '^([^=]+)=(.*)$') {
              $releaseMap[$matches[1].Trim()] = $matches[2].Trim()
            }
          }

          if (-not $releaseMap.ContainsKey('version')) {
            Get-Content ./dist/soop-recorder/RELEASE_INFO.txt | ForEach-Object { Write-Host "META: [$_]" }
            throw 'release metadata missing version key'
          }
          if ($releaseMap['version'] -ne $cargoVersion) {
            Get-Content ./dist/soop-recorder/RELEASE_INFO.txt | ForEach-Object { Write-Host "META: [$_]" }
            throw "release metadata version mismatch: expected $cargoVersion actual $($releaseMap['version'])"
          }
