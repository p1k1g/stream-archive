name: Rust web check

on:
  push:
    paths:
      - "rust-web/**"
      - ".github/workflows/rust-web-check.yml"
  pull_request:
    paths:
      - "rust-web/**"
      - ".github/workflows/rust-web-check.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests
        run: cargo test --manifest-path rust-web/Cargo.toml

  windows-check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Windows native compile check
        run: cargo check --manifest-path rust-web/Cargo.toml
