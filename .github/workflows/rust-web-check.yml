name: Rust web check

on:
  push:
    paths:
      - "rust-web/**"
      - "BUILD_RUST_WEB.bat"
      - "RUN_RUST_WEB.bat"
      - "PACKAGE_RUST_WEB.bat"
      - "backend/*.example.*"
      - "backend/vod/*.example.ini"
      - ".github/workflows/rust-web-check.yml"
      - ".github/workflows/rust-web-release.yml"
  pull_request:
    paths:
      - "rust-web/**"
      - "BUILD_RUST_WEB.bat"
      - "RUN_RUST_WEB.bat"
      - "PACKAGE_RUST_WEB.bat"
      - "backend/*.example.*"
      - "backend/vod/*.example.ini"
      - ".github/workflows/rust-web-check.yml"
      - ".github/workflows/rust-web-release.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests
        run: cargo test --manifest-path rust-web/Cargo.toml

  windows-check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Windows native compile check
        run: cargo check --manifest-path rust-web/Cargo.toml
