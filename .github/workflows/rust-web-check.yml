name: Rust web check

on:
  pull_request:
    branches:
      - main
    paths:
      - "rust-web/**"
      - "BUILD_RUST_WEB.bat"
      - "RUN_RUST_WEB.bat"
      - "PACKAGE_RUST_WEB.bat"
      - "maintenance/**"
      - "docs/**"
      - "deploy/**"
      - "backend/*.example.*"
      - "backend/vod/*.example.ini"
      - ".github/workflows/rust-web-check.yml"
      - ".github/workflows/rust-web-release.yml"
  workflow_dispatch:

concurrency:
  group: rust-web-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-check:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          rustc --version
          cargo --version
          git --version

      - name: Rust unit tests
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: cargo test --locked --manifest-path rust-web/Cargo.toml

      - name: Windows native compile check
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: cargo check --locked --manifest-path rust-web/Cargo.toml

      - name: Windows portable package smoke
        shell: cmd
        run: PACKAGE_RUST_WEB.bat

      - name: Verify portable package
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $required = @(
            './dist/soop-recorder/soop-server.exe',
            './dist/soop-recorder/soop-launcher.exe',
            './dist/soop-recorder/RUN.bat',
            './dist/soop-recorder/RUN_SERVER_CONSOLE.bat',
            './dist/soop-recorder/BACKUP_DATA.bat',
            './dist/soop-recorder/RESTORE_DATA.bat',
            './dist/soop-recorder/Caddyfile.example',
            './dist/soop-recorder/RELEASE_INFO.txt',
            './dist/soop-recorder/SHA256SUMS.txt',
            './dist/soop-recorder/maintenance/Backup-SoopData.ps1',
            './dist/soop-recorder/maintenance/Restore-SoopData.ps1',
            './dist/soop-recorder/docs/OPERATIONS.md',
            './dist/soop-recorder/docs/REVERSE_PROXY.md',
            './dist/soop-recorder/docs/LOCAL_LAUNCHER.md'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing package file: $path" }
          }

          $expected = @{}
          foreach ($line in Get-Content ./dist/soop-recorder/SHA256SUMS.txt) {
            if ($line -match '^([0-9a-fA-F]{64})\s+(.+)$') {
              $expected[$matches[2].Trim()] = $matches[1].ToLowerInvariant()
            }
          }
          foreach ($name in @('soop-server.exe', 'soop-launcher.exe')) {
            if (-not $expected.ContainsKey($name)) { throw "checksum missing: $name" }
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path './dist/soop-recorder' $name)).Hash.ToLowerInvariant()
            if ($expected[$name] -ne $actual) { throw "$name checksum mismatch" }
          }

          $run = Get-Content ./dist/soop-recorder/RUN.bat -Raw
          if ($run -notmatch 'soop-launcher\.exe') { throw 'RUN.bat does not use soop-launcher.exe' }

          $direct = Get-Content ./dist/soop-recorder/RUN_SERVER_CONSOLE.bat -Raw
          if ($direct -notmatch 'soop-server\.exe') { throw 'RUN_SERVER_CONSOLE.bat does not start soop-server.exe' }

          $caddy = Get-Content ./dist/soop-recorder/Caddyfile.example -Raw
          if ($caddy -notmatch 'reverse_proxy\s+127\.0\.0\.1:8787') { throw 'Caddy template upstream mismatch' }

          $metadata = cargo metadata --locked --no-deps --format-version 1 --manifest-path ./rust-web/Cargo.toml | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          $cargoVersion = ($metadata.packages | Where-Object { $_.name -eq 'soop-web' } | Select-Object -First 1).version
          if ([string]::IsNullOrWhiteSpace($cargoVersion)) { throw 'soop-web version not found in cargo metadata' }

          $releaseMap = @{}
          foreach ($line in Get-Content ./dist/soop-recorder/RELEASE_INFO.txt) {
            $clean = $line.Trim().TrimStart([char]0xFEFF)
            if ($clean -match '^([^=]+)=(.*)$') {
              $releaseMap[$matches[1].Trim()] = $matches[2].Trim()
            }
          }
          if (-not $releaseMap.ContainsKey('version')) { throw 'release metadata missing version key' }
          if ($releaseMap['version'] -ne $cargoVersion) { throw "release metadata version mismatch: expected $cargoVersion actual $($releaseMap['version'])" }
