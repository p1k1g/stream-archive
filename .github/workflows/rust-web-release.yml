name: Rust web portable release

on:
  workflow_dispatch:

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        shell: pwsh
        run: cargo build --release --manifest-path ./rust-web/Cargo.toml
      - name: Assemble portable package
        shell: cmd
        run: PACKAGE_RUST_WEB.bat
      - name: Archive portable package
        shell: pwsh
        run: Compress-Archive -Path ./dist/soop-recorder/* -DestinationPath ./soop-recorder-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: soop-recorder-windows-x64
          path: ./soop-recorder-windows-x64.zip
          retention-days: 3
