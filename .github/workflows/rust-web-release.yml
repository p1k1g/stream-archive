name: Stream Archive portable release

on:
  workflow_dispatch:

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-web -> target
            rust-gui -> target
          cache-on-failure: true

      - name: Environment
        shell: powershell
        run: |
          rustc --version
          cargo --version
          git --version

      - name: Shared runtime unit tests
        shell: powershell
        # Match PR CI: the Windows Job Object regression launches real child
        # processes, so serialize the harness to avoid scheduler/AV false negatives.
        run: cargo test --locked --manifest-path ./rust-web/Cargo.toml -- --test-threads=1

      - name: Native GUI unit tests
        shell: powershell
        run: cargo test --locked --manifest-path ./rust-gui/Cargo.toml

      - name: Build and assemble portable package
        shell: cmd
        run: BUILD_PORTABLE.bat

      - name: Verify package checksum metadata
        shell: powershell
        run: |
          $root = './dist/stream-archive'
          $required = @(
            "$root/StreamArchive.exe",
            "$root/stream-archive-server.exe",
            "$root/RUN.bat",
            "$root/RUN_HEADLESS.bat",
            "$root/LICENSE",
            "$root/THIRD_PARTY_NOTICES.md",
            "$root/docs/OPERATIONS.md"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing package file: $path" }
          }
          foreach ($forbidden in @(
            "$root/stream-archive-launcher.exe",
            "$root/RUN_WEB.bat",
            "$root/RUN_SERVER_CONSOLE.bat",
            "$root/Caddyfile.example",
            "$root/docs/REVERSE_PROXY.md",
            "$root/docs/LOCAL_LAUNCHER.md"
          )) {
            if (Test-Path -LiteralPath $forbidden) { throw "Retired Web package file returned: $forbidden" }
          }

          $expected = @{}
          foreach ($line in Get-Content "$root/SHA256SUMS.txt") {
            if ($line -match '^([0-9a-fA-F]{64})\s+(.+)$') {
              $expected[$matches[2].Trim()] = $matches[1].ToLowerInvariant()
            }
          }
          foreach ($name in @('StreamArchive.exe', 'stream-archive-server.exe')) {
            if (-not $expected.ContainsKey($name)) { throw "checksum missing: $name" }
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $root $name)).Hash.ToLowerInvariant()
            if ($expected[$name] -ne $actual) { throw "$name checksum mismatch" }
          }
          $run = Get-Content "$root/RUN.bat" -Raw
          if ($run -notmatch 'StreamArchive\.exe') { throw 'RUN.bat does not use StreamArchive.exe' }
          if ($run -match 'launcher|RUN_WEB|127\.0\.0\.1|http') { throw 'RUN.bat must remain native-only' }
          $headless = Get-Content "$root/RUN_HEADLESS.bat" -Raw
          if ($headless -notmatch 'stream-archive-server\.exe') { throw 'RUN_HEADLESS.bat does not use the headless runtime' }
          foreach ($dir in @("$root/backend", "$root/data")) {
            if (-not (Test-Path -LiteralPath $dir -PathType Container)) { throw "Missing package directory: $dir" }
          }
          if ((Get-Content "$root/LICENSE" -Raw) -notmatch 'GNU AFFERO GENERAL PUBLIC LICENSE') { throw 'AGPL license text missing from package' }
          Get-Content "$root/RELEASE_INFO.txt"

      - name: Archive portable package
        shell: powershell
        run: Compress-Archive -Path ./dist/stream-archive/* -DestinationPath ./stream-archive-windows-x64.zip -Force

      - name: Write archive checksum
        shell: powershell
        run: |
          $h=(Get-FileHash -Algorithm SHA256 ./stream-archive-windows-x64.zip).Hash.ToLowerInvariant()
          "$h  stream-archive-windows-x64.zip" | Set-Content ./stream-archive-windows-x64.zip.sha256 -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: stream-archive-windows-x64
          path: |
            ./stream-archive-windows-x64.zip
            ./stream-archive-windows-x64.zip.sha256
          retention-days: 1
