<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOOP Recorder</title><link rel="stylesheet" href="/style.css">
</head>
<body>
<header><div><h1>SOOP Recorder</h1><small>Rust Web Phase 1 · PowerShell bridge</small></div><button id="tokenBtn">토큰 변경</button></header>
<main>
<section><div class="title"><h2>Watcher</h2><b id="watcher">확인 중</b></div><p>PID: <span id="pid">-</span></p><p class="mono">Backend: <span id="backend">-</span></p><button id="start">시작</button> <button id="stop" class="danger">중지</button></section>
<section><div class="title"><h2>채널</h2><div><button id="add">+ 추가</button> <button id="saveChannels">저장</button></div></div><div class="table"><table><thead><tr><th>사용</th><th>이름</th><th>계정</th><th>출력경로</th><th></th></tr></thead><tbody id="channels"></tbody></table></div></section>
<section><div class="title"><h2>설정</h2><button id="saveSettings">저장</button></div><div id="settings" class="grid"></div><p class="hint">SOOP_PASSWORD / CLOUDFLARE_API_KEY는 웹에서 읽거나 수정하지 않습니다.</p></section>
<section><div class="title"><h2>로그</h2><button id="refreshLogs">새로고침</button></div><pre id="logs">로딩 중...</pre></section>
</main><div id="toast"></div><script src="/app.js"></script>
</body></html>
