<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOOP Recorder</title><link rel="stylesheet" href="/style.css">
</head>
<body>
<header><div><h1>SOOP Recorder</h1><small>Rust Web Phase 3 · Native Watcher + RecorderManager + DPAPI</small></div><button id="tokenBtn">토큰 변경</button></header>
<main>
<section>
  <div class="title"><h2>Watcher</h2><b id="watcher">확인 중</b></div>
  <div class="summary"><span>Engine <b id="engine">-</b></span><span>채널 <b id="channelCount">0</b></span><span>REC <b id="recCount">0</b></span><span>OFFLINE <b id="offlineCount">0</b></span><span>ERROR <b id="errorCount">0</b></span></div>
  <p class="mono">Backend: <span id="backend">-</span></p>
  <button id="start">시작</button> <button id="stop" class="danger">중지</button>
</section>
<section>
  <div class="title"><h2>실시간 상태</h2><button id="refreshStatus">새로고침</button></div>
  <div class="table"><table><thead><tr><th>상태</th><th>이름</th><th>계정</th><th>방송/파일</th><th>크기</th><th>제어</th></tr></thead><tbody id="runtime"></tbody></table></div>
</section>
<section><div class="title"><h2>채널</h2><div><button id="add">+ 추가</button> <button id="saveChannels">저장</button></div></div><div class="table"><table><thead><tr><th>사용</th><th>이름</th><th>계정</th><th>출력경로</th><th></th></tr></thead><tbody id="channels"></tbody></table></div></section>
<section>
  <div class="title"><h2>보안 설정</h2><button id="saveSecrets">암호화 저장</button></div>
  <div class="grid">
    <label>SOOP_PASSWORD <span id="soopPasswordState" class="hint">확인 중</span><input id="soopPassword" type="password" autocomplete="new-password" placeholder="빈칸이면 기존 값 유지"></label>
    <label>CLOUDFLARE_API_KEY <span id="cloudflareKeyState" class="hint">확인 중</span><input id="cloudflareKey" type="password" autocomplete="new-password" placeholder="빈칸이면 기존 값 유지"></label>
  </div>
  <p class="hint">저장된 값은 API/화면으로 다시 노출하지 않습니다. Windows CurrentUser DPAPI로 암호화하며 기존 dpapi:v1 값과 호환됩니다.</p>
</section>
<section><div class="title"><h2>설정</h2><button id="saveSettings">저장</button></div><div id="settings" class="grid"></div></section>
<section><div class="title"><h2>로그</h2><button id="refreshLogs">새로고침</button></div><pre id="logs">로딩 중...</pre></section>
</main><div id="toast"></div><script src="/app.js"></script>
</body></html>
