# SOOP LIVE Downloader settings example
# Copy to SOOP_LIVE_SETTING.ini and enter private values locally.

CHECK_INTERVAL=30
CHANNEL_RELOAD_INTERVAL=2
RECORD_RETRY_INTERVAL=5
RECORD_STALL_TIMEOUT=90
RECORD_MONITOR_INTERVAL=5
WORKER_MAX_RETRY=3
CONSOLE_REFRESH_INTERVAL=5
CONSOLE_AUTO_FORMAT=Y
CHANNEL_NAME_WIDTH=AUTO
CONSOLE_COLOR=Y
CONSOLE_SHOW_PATH=N
MIN_FREE_SPACE_GB=20

OUTPUT_DIR=C:\SOOP_LIVE
QUALITY=best
FILE_NAME_PATTERN=LEGACY

STREAMLINK_PATH=AUTO
STREAMLINK_FALLBACK=AUTO

SOOP_USERNAME=
SOOP_PASSWORD=
SOOP_PURGE_CREDENTIALS=N

CLOUDFLARE_WORKER_URL=https://your-worker.example.com/soop/url
CLOUDFLARE_API_KEY=
MASTER_QUALITY=auto

LOG_ENABLED=Y
LOG_DIR=.\logs
LOG_RETENTION_DAYS=30
